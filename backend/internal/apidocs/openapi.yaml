openapi: 3.1.0
info:
  title: QR Classroom Quiz Platform API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    REST API of the QR Classroom Quiz Platform (single Go binary, see the architecture document).

    **Authentication.** Log in with `POST /api/auth/login`. The server sets an HttpOnly
    `__Host-sid` session cookie (ADR-13); browsers send it automatically. Tokens are never
    returned in a response body.

    **CSRF.** Every state-changing request (POST, PUT, PATCH, DELETE) must send the header
    `X-Requested-With` (any value, e.g. `fetch`). If an `Origin` header is present it must match
    the server's base URL. Swagger UI on this page adds the header for you.

    **Errors** share one shape (`Error`): `code` is stable and machine-readable; validation
    failures (422) list per-field messages in `fields`.

    **Real time.** `GET /ws/attempts/{id}` (student) and `GET /ws/sessions/{id}` (teacher) upgrade
    to WebSockets; messages are JSON objects with a `type` field. See the descriptions on those
    operations.
servers:
  - url: /
security:
  - session: []
tags:
  - name: auth
    description: Accounts and sessions (FR-ACC)
  - name: admin
    description: Platform administration (admins, and managers with the route's feature, D-56)
  - name: tutoring
    description: Single sign-on to the separate tutoring service (D-59); the service has its own API
  - name: storage
    description: Storage overview, limits, clean-up and encrypted backups (PL-FR-04 to PL-FR-09, D-57)
  - name: settings
    description: Hierarchical configuration (BA §7)
  - name: classrooms
    description: Classrooms, modules, topics and enrolments (FR-CLS)
  - name: quizzes
    description: Quizzes, questions, CSV import and resources (FR-QZ)
  - name: sessions
    description: Live sessions, teacher controls (FR-SS, FR-PR)
  - name: student
    description: Joining, answering and own results (student role)
  - name: marking
    description: Evaluation, review and LLM marking (FR-EV)
  - name: llm-keys
    description: Per-teacher LLM API keys (BR-10)
  - name: analytics
    description: Analytics, sharing and export (FR-RS)
  - name: public
    description: Unauthenticated endpoints
  - name: realtime
    description: WebSockets and beacons
  - name: polls
    description: Live polls, anonymous or identified (D-40)
  - name: drive
    description: Teachers' Google Drive (D-71); only files they pick or the platform makes (drive.file)
  - name: meetings
    description: Peer-to-peer video meetings (D-69); the server only passes the set-up messages

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [public]
      summary: Liveness and database check
      security: []
      responses:
        '200': { description: 'Healthy', content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } } }
        '503': { description: 'Database unavailable' }

  # ---------------- auth ----------------
  /api/auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      summary: Self-register a student or teacher (FR-ACC-01/02)
      description: Logs the user in immediately unless the account needs admin approval. Queues a verification email.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } } }
      responses:
        '201': { description: 'Created (Set-Cookie when active)', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Busy' }
  /api/auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Log in
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } } }
      responses:
        '200': { description: 'Logged in; sets the `__Host-sid` cookie', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'Suspended or awaiting approval (`account_suspended`, `pending_approval`); with school sign-in, not in an allowed group (`directory_not_allowed`) or no email in the directory (`directory_no_email`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'A school account whose email belongs to an account that can''t be moved to school sign-in (`directory_conflict`, D-64)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: 'Busy, or the school directory can''t be reached (`directory_unavailable`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/options:
    get:
      operationId: getAuthOptions
      tags: [auth]
      summary: What the login page offers
      description: '`directory` is true when students and teachers can sign in with their school account (LDAP or Active Directory, D-64); `sso` lists the enabled OpenID Connect providers, one button each (D-70).'
      security: []
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { directory: { type: boolean }, sso: { type: array, items: { $ref: '#/components/schemas/SSOOption' } } } } } } } }
  /api/auth/oidc/{id}/start:
    get:
      operationId: getAuthOidcStart
      tags: [auth]
      summary: Sign in with an OpenID Connect provider (browser navigation, D-70)
      description: 'Redirects to the provider (authorization code flow with PKCE and a nonce) and sets a short-lived state cookie. `next` is a path on this site to return to.'
      security: []
      parameters: [{ $ref: '#/components/parameters/id' }, { name: next, in: query, schema: { type: string, example: /my } }]
      responses: { '302': { description: 'To the provider' }, '404': { $ref: '#/components/responses/NotFound' }, '502': { description: 'The provider can''t be reached (`sso_unavailable`)' } }
  /api/auth/oidc/{id}/link:
    get:
      operationId: getAuthOidcLink
      tags: [auth]
      summary: Connect a provider to the signed-in account (browser navigation, D-70)
      description: Like `start`, but the provider's sign-in is added to the current account; the browser comes back to `/account?sso=linked`.
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '302': { description: 'To the provider' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      tags: [auth]
      summary: Where providers send the browser back (D-70)
      description: |
        Register this address with each provider. It checks the state cookie, exchanges the code (with the PKCE verifier) and checks the ID token's
        signature, issuer, audience, expiry and nonce, then signs in and redirects to `next`. On failure it redirects to `/login?sso_error=CODE`
        (or `/account?sso_error=` when linking): `sso_expired`, `sso_cancelled`, `sso_no_account`, `sso_email_unverified`, `sso_conflict`,
        `sso_taken`, `sso_domain`, `sso_unavailable`, `account_suspended`, `pending_approval`, `sso_failed`.
      security: []
      parameters: [{ name: state, in: query, schema: { type: string } }, { name: code, in: query, schema: { type: string } }, { name: error, in: query, schema: { type: string } }]
      responses: { '302': { description: 'Signed in, or back with a reason' } }
  /api/auth/oidc/identities:
    get:
      operationId: getAuthOidcIdentities
      tags: [auth]
      summary: Your connected sign-ins, and the providers you could connect (D-70)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { identities: { type: array, items: { $ref: '#/components/schemas/Identity' } }, available: { type: array, items: { $ref: '#/components/schemas/SSOOption' } } } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/oidc/identities/{id}:
    delete:
      operationId: deleteAuthOidcIdentity
      tags: [auth]
      summary: Disconnect a provider from your account (D-70)
      description: Refused (400) when it's the only way into the account; set a password first.
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Disconnected' }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Log out (revokes this session)
      responses: { '204': { description: 'Logged out' } }
  /api/auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: The current user
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteAuthMe
      tags: [auth]
      summary: Delete (anonymise) my own account (NFR-04)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } } }
      responses:
        '204': { description: 'Deleted' }
        '400': { description: 'Admin accounts cannot self-delete' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/me/password:
    post:
      operationId: postAuthMePassword
      tags: [auth]
      summary: Change my password (D-49)
      description: Needs the current password. Other devices are signed out; this one stays. The owner gets an email. Attempts are rate-limited like logins.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 8, maxLength: 128 } } } } } }
      responses:
        '204': { description: 'Changed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/me/avatar:
    put:
      operationId: putAuthMeAvatar
      tags: [auth]
      summary: Upload my profile picture (PNG, JPEG, WebP or GIF, at most 512 KB)
      description: The picture is cropped to a square and re-encoded as a 256×256 JPEG; metadata such as EXIF location is not kept.
      requestBody: { required: true, content: { image/*: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: 'Saved', content: { application/json: { schema: { type: object, properties: { avatar: { type: string, description: 'New version' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: 'Larger than 512 KB', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      operationId: deleteAuthMeAvatar
      tags: [auth]
      summary: Remove my profile picture
      responses: { '204': { description: 'Removed' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/users/{id}/avatar:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getAuthUsersAvatar
      tags: [auth]
      summary: A profile picture (JPEG)
      description: Visible to the person, admins, and anyone who shares a classroom with them (teacher and student); otherwise 404. With ?v={avatar version} the response is cached for good; supports If-None-Match.
      parameters: [{ name: v, in: query, schema: { type: string } }]
      responses:
        '200': { description: 'The picture', content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '304': { description: 'Not modified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/auth/verify-email:
    post:
      operationId: postAuthVerifyEmail
      tags: [auth]
      summary: Confirm an email address with the emailed token
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenInput' } } } }
      responses: { '204': { description: 'Verified' }, '400': { $ref: '#/components/responses/Error' } }
  /api/auth/password-reset/request:
    post:
      operationId: postAuthPasswordResetRequest
      tags: [auth]
      summary: Email a password reset link (always 202, no account enumeration)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses: { '202': { description: 'Accepted' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /api/auth/password-reset/confirm:
    post:
      operationId: postAuthPasswordResetConfirm
      tags: [auth]
      summary: Set a new password; revokes all sessions
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 8 } } } } } }
      responses: { '204': { description: 'Changed' }, '400': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Invalid' } }

  # ---------------- admin ----------------
  /api/admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List and search users (admins, and managers with "View users")
      description: Role `manager` lists every manager, teacher-managers included. A manager sees that someone is a manager, but not their features.
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [student, teacher, manager, admin] } }
        - { name: status, in: query, schema: { type: string, enum: [active, pending_approval, suspended] } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/q' }
        - { $ref: '#/components/parameters/dir' }
        - { name: sort, in: query, schema: { type: string, enum: [created, name, email, role, status] } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, users: { type: array, items: { $ref: '#/components/schemas/User' } } } } } } } }
  /api/admin/users/{id}/status:
    post:
      operationId: postAdminUsersStatus
      tags: [admin]
      summary: Activate/approve or suspend a user (FR-ACC-04/05; managers with "Manage users")
      description: A manager may act only on teachers and students (403, logged, PL-FR-13). The last active admin can't be suspended (409 `last_admin`, PL-FR-17).
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, suspended] } } } } } }
      responses: { '204': { description: 'Updated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/admin/users/{id}:
    delete:
      operationId: deleteAdminUsersById
      tags: [admin]
      summary: Delete (anonymise) a user; results are kept
      description: Same rules as changing the status (PL-FR-13, PL-FR-17).
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Deleted' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/admin/drive:
    get:
      operationId: getAdminDrive
      tags: [admin, drive]
      summary: The platform's Google Cloud app for Drive, and the redirect URI and origin to register (admins only, D-71)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { config: { $ref: '#/components/schemas/DriveConfig' }, redirect_url: { type: string }, origin: { type: string } } } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: putAdminDrive
      tags: [admin, drive]
      summary: Save the Google app (admins only, D-71)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DriveConfig' } } } }
      responses: { '200': { description: 'Saved', content: { application/json: { schema: { $ref: '#/components/schemas/DriveConfig' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/meeting-limits:
    get:
      operationId: getAdminMeetingLimits
      tags: [admin, meetings]
      summary: Meeting limits (admins, or managers with the settings feature; D-72)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/MeetingLimits' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: putAdminMeetingLimits
      tags: [admin, meetings]
      summary: Set the meeting limits; a lower size applies to open meetings at once (D-72)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingLimits' } } } }
      responses: { '200': { description: 'Saved', content: { application/json: { schema: { $ref: '#/components/schemas/MeetingLimits' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/sso:
    get:
      operationId: getAdminSso
      tags: [admin]
      summary: Sign-in providers, and the redirect URL to register with them (admins only, D-70)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { providers: { type: array, items: { $ref: '#/components/schemas/SSOProvider' } }, redirect_url: { type: string, format: uri } } } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: postAdminSso
      tags: [admin]
      summary: Add a sign-in provider (admins only, D-70)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SSOProvider' } } } }
      responses: { '201': { description: 'Added', content: { application/json: { schema: { $ref: '#/components/schemas/SSOProvider' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/sso/{id}:
    put:
      operationId: putAdminSso
      tags: [admin]
      summary: Change a sign-in provider (admins only, D-70)
      description: An empty `client_secret` keeps the stored one; `clear_secret` removes it (a public client).
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SSOProvider' } } } }
      responses: { '200': { description: 'Saved', content: { application/json: { schema: { $ref: '#/components/schemas/SSOProvider' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Invalid' } }
    delete:
      operationId: deleteAdminSso
      tags: [admin]
      summary: Remove a sign-in provider and every account's sign-in with it (admins only, D-70)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Removed' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/admin/sso-order:
    put:
      operationId: putAdminSsoOrder
      tags: [admin]
      summary: The order of the sign-in buttons (admins only, D-70)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { '204': { description: 'Saved' } }
  /api/admin/sso/test:
    post:
      operationId: postAdminSsoTest
      tags: [admin]
      summary: Read an issuer's discovery document, as a sign-in would (admins only, D-70)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [issuer], properties: { issuer: { type: string, format: uri } } } } } }
      responses: { '200': { description: 'The result (ok or not)', content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, message: { type: string }, authorization_endpoint: { type: string }, token_endpoint: { type: string }, scopes_supported: { type: array, items: { type: string } }, pkce: { type: boolean } } } } } } }
  /api/admin/directory:
    get:
      operationId: getAdminDirectory
      tags: [admin]
      summary: School sign-in settings (LDAP, Active Directory; admins only, D-64)
      description: The service account's password is never returned; `bind_password_set` says whether one is stored. `defaults` gives the filter and attributes for each kind.
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { config: { $ref: '#/components/schemas/DirectoryConfig' }, defaults: { type: object, additionalProperties: { $ref: '#/components/schemas/DirectoryConfig' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putAdminDirectory
      tags: [admin]
      summary: Change the school sign-in settings
      description: An empty `bind_password` keeps the stored one. Only `ldaps://`, or `ldap://` with StartTLS, is accepted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryConfig' } } } }
      responses:
        '200': { description: 'Saved', content: { application/json: { schema: { $ref: '#/components/schemas/DirectoryConfig' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/admin/directory/test:
    post:
      operationId: postAdminDirectoryTest
      tags: [admin]
      summary: Try unsaved settings, and optionally a sign-in, step by step
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { config: { $ref: '#/components/schemas/DirectoryConfig' }, login: { type: string }, password: { type: string, format: password } } } } } }
      responses:
        '200':
          description: The steps and what the account would get
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  steps: { type: array, items: { type: object, properties: { name: { type: string }, ok: { type: boolean }, detail: { type: string } } } }
                  account: { type: object, properties: { email: { type: string }, name: { type: string }, role: { type: string, enum: [student, teacher] }, dn: { type: string } } }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/admin/auth-policy:
    get:
      operationId: getAdminAuthPolicy
      tags: [admin]
      summary: Teacher-approval policy
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AuthPolicy' } } } } }
    put:
      operationId: putAdminAuthPolicy
      tags: [admin]
      summary: Change the teacher-approval policy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthPolicy' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/AuthPolicy' } } } } }
  /api/admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin, settings]
      summary: Platform default settings
      responses: { '200': { $ref: '#/components/responses/Layer' } }
    put:
      operationId: putAdminSettings
      tags: [admin, settings]
      summary: Set platform default settings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Overrides' } } } }
      responses: { '200': { $ref: '#/components/responses/Layer' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/usage:
    get:
      operationId: getAdminUsage
      tags: [admin]
      summary: Platform usage counts (no content, answers or keys)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Usage' } } } } }
  /api/admin/audit:
    get:
      operationId: getAdminAudit
      tags: [admin]
      summary: Audit log, newest first (NFR-15)
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: actor, in: query, description: 'Only this user''s actions, e.g. one manager''s (PL-FR-15)', schema: { type: string, format: uuid } }
        - { name: actor_role, in: query, description: 'The role the actor acted in', schema: { type: string, enum: [admin, manager] } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/q' }
        - { $ref: '#/components/parameters/dir' }
        - { name: sort, in: query, schema: { type: string, enum: [time] } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, events: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } } } } } } }

  /api/admin/managers:
    get:
      operationId: getAdminManagers
      tags: [admin]
      summary: Managers with their features, who made them and their last activity (PL-FR-16; admins only)
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/q' }
        - { $ref: '#/components/parameters/dir' }
        - { name: sort, in: query, schema: { type: string, enum: [granted, name, email, active] } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, managers: { type: array, items: { $ref: '#/components/schemas/ManagerRow' } } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: postAdminManagers
      tags: [admin]
      summary: Make a manager (PL-FR-10, PL-FR-11; admins only)
      description: Give `user_id` to make an active teacher a manager who keeps teaching, or `email` and `name` to create a manager-only account, which is emailed a link to set its password. Managers get only the features listed; "Manage users" brings "View users".
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MakeManagerInput' } } } }
      responses: { '201': { description: 'Made', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/managers/{id}/features:
    put:
      operationId: putAdminManagersFeatures
      tags: [admin]
      summary: Change a manager's features; applies at once (PL-FR-12; admins only)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [features], properties: { features: { type: array, items: { $ref: '#/components/schemas/Feature' } } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/managers/{id}:
    delete:
      operationId: deleteAdminManagersById
      tags: [admin]
      summary: Remove the manager role (PL-FR-12; admins only)
      description: A teacher-manager goes back to being a teacher; a manager-only account is suspended and signed out.
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Removed' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/admin/storage:
    get:
      operationId: getAdminStorage
      tags: [admin, storage]
      summary: Space the platform uses, at most an hour old (PL-FR-04; "Storage" feature)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/StorageOverview' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/admin/storage/refresh:
    post:
      operationId: postAdminStorageRefresh
      tags: [admin, storage]
      summary: Measure again now (at most every 30 seconds)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/StorageOverview' } } } } }
  /api/admin/storage/limits:
    put:
      operationId: putAdminStorageLimits
      tags: [admin, storage]
      summary: Set the recording limit and the space kept for backups (PL-FR-05)
      description: Each at least 100 MB and at most the free disk space plus what that kind already uses. A smaller backup space deletes the oldest console backups at once.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StorageLimits' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/StorageLimits' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/storage/cleanup:
    get:
      operationId: getAdminStorageCleanup
      tags: [admin, storage]
      summary: What can be cleaned up (PL-FR-06; "Clean-up" feature)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { areas: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string } } } } } } } } } }
    post:
      operationId: postAdminStorageCleanup
      tags: [admin, storage]
      summary: Delete an area's data from before a date; audited
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CleanupInput' } } } }
      responses: { '200': { description: 'What was deleted', content: { application/json: { schema: { $ref: '#/components/schemas/Freed' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/storage/cleanup/preview:
    post:
      operationId: postAdminStorageCleanupPreview
      tags: [admin, storage]
      summary: What a clean-up would delete and the space it frees
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CleanupInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Freed' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/backups:
    get:
      operationId: getAdminBackups
      tags: [admin, storage]
      summary: Backup history, console and nightly (PL-FR-08; "Backups" feature)
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [console, nightly] } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/dir' }
        - { name: sort, in: query, schema: { type: string, enum: [started, size] } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, backups: { type: array, items: { $ref: '#/components/schemas/Backup' } }, nightly: { $ref: '#/components/schemas/NightlyStatus' } } } } } } }
    post:
      operationId: postAdminBackups
      tags: [admin, storage]
      summary: Start a full, encrypted backup (PL-FR-07)
      description: Runs in the background; follow it in the list. The passphrase encrypts the file and is never stored. Refused while another backup runs, or when the free space is under about twice the database's size.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [passphrase], properties: { passphrase: { type: string, minLength: 12 } } } } } }
      responses: { '202': { description: 'Started', content: { application/json: { schema: { $ref: '#/components/schemas/Backup' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/admin/backups/{id}:
    delete:
      operationId: deleteAdminBackupsById
      tags: [admin, storage]
      summary: Delete a backup's file; the history row stays
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Deleted' }, '404': { $ref: '#/components/responses/NotFound' }, '410': { description: 'No longer on the server', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /api/admin/backups/{id}/link:
    post:
      operationId: postAdminBackupsLink
      tags: [admin, storage]
      summary: A single-use download link for the caller, valid for an hour (PL-NFR-03)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '201': { description: 'Link', content: { application/json: { schema: { type: object, properties: { url: { type: string }, expires_at: { type: string, format: date-time } } } } } }, '410': { description: 'No longer on the server', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /api/admin/backups/download/{token}:
    get:
      operationId: getAdminBackupsDownload
      tags: [admin, storage]
      summary: Download a backup; the link works once, for the person who asked for it
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'The encrypted backup', content: { application/octet-stream: { schema: { type: string, format: binary } } } }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/tutoring/config:
    get:
      operationId: getTutoringConfig
      tags: [tutoring]
      summary: Whether tutoring is on, and the tutoring service's address (D-59)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, url: { type: string, format: uri } } } } } } }
  /api/tutoring/token:
    post:
      operationId: postTutoringToken
      tags: [tutoring]
      summary: A 5-minute signed token naming the logged-in person, for the tutoring service (ADR-23, TS-NFR-52)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { token: { type: string }, expires_at: { type: string, format: date-time }, url: { type: string, format: uri } } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { description: 'Tutoring is off' } }

  /api/teacher/drive:
    get:
      operationId: getTeacherDrive
      tags: [drive]
      summary: Whether Drive is available and connected, and its settings (D-71)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DriveStatus' } } } } }
    put:
      operationId: putTeacherDrive
      tags: [drive]
      summary: Save each session's results to Drive when it ends, or not
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { auto_backup: { type: boolean } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DriveStatus' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      operationId: deleteTeacherDrive
      tags: [drive]
      summary: Disconnect Drive; the platform revokes its token with Google
      responses: { '204': { description: 'Disconnected' } }
  /api/teacher/drive/connect:
    get:
      operationId: getTeacherDriveConnect
      tags: [drive]
      summary: Connect Drive (browser navigation to Google's consent, with PKCE)
      parameters: [{ name: next, in: query, schema: { type: string, example: /t/settings } }]
      responses: { '302': { description: 'To Google' }, '404': { description: 'Drive isn''t set up (`drive_off`)' } }
  /api/teacher/drive/callback:
    get:
      operationId: getTeacherDriveCallback
      tags: [drive]
      summary: Where Google sends the teacher back; register it as the OAuth redirect URI
      description: 'Redirects to `next` with `drive=connected`, or `drive_error=`: `drive_expired`, `drive_cancelled`, `drive_scope` (Drive was unticked), `drive_off`, `drive_failed`.'
      responses: { '302': { description: 'Back to the page' } }
  /api/teacher/drive/picker:
    post:
      operationId: postTeacherDrivePicker
      tags: [drive]
      summary: A short-lived access token and the app's ids, for Google's file picker in the browser
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { access_token: { type: string }, expires_at: { type: string, format: date-time }, api_key: { type: string }, app_id: { type: string } } } } } }, '409': { description: '`drive_not_connected` or `drive_reconnect`' } }
  /api/teacher/drive/share:
    post:
      operationId: postTeacherDriveShare
      tags: [drive]
      summary: Let anyone with the link view a picked file, for a question's image or a link in its text
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [file_id], properties: { file_id: { type: string, description: 'A Drive file id from the picker' } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { id: { type: string }, name: { type: string }, mime_type: { type: string }, web_link: { type: string }, image: { type: boolean }, image_url: { type: string, description: 'For POST questions/{id}/resources' } } } } } }, '403': { description: 'Not a file the platform may open (`drive_no_access`)' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/drive/exports:
    get:
      operationId: getTeacherDriveExports
      tags: [drive]
      summary: Recent results saved to Drive, or those of one session or poll
      parameters: [{ name: target_id, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { exports: { type: array, items: { $ref: '#/components/schemas/DriveExport' } } } } } } } }
  /api/teacher/quizzes/{id}/questions/import-drive:
    post:
      operationId: postTeacherQuizQuestionsImportDrive
      tags: [drive, quizzes]
      summary: Import questions from a CSV file or a Google Sheet (its first sheet) in Drive
      description: Same columns and checks as the CSV upload; 2 MB at most.
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [file_id], properties: { file_id: { type: string, description: 'A Drive file id from the picker' } } } } } }
      responses: { '200': { description: 'Imported and rejected rows', content: { application/json: { schema: { type: object, properties: { imported: { type: integer }, rejected: { type: array, items: { type: object } } } } } } }, '403': { description: '`drive_no_access`' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/classrooms/{id}/drive-files:
    get:
      operationId: getTeacherClassroomDriveFiles
      tags: [drive, classrooms]
      summary: A classroom's Drive files, with how each is shared
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { files: { type: array, items: { $ref: '#/components/schemas/ClassroomDriveFile' } } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: postTeacherClassroomDriveFiles
      tags: [drive, classrooms]
      summary: Attach picked files to a classroom and share them
      description: '`students` shares with each actively enrolled student''s email (kept in step as students join and leave, every 15 minutes); `link` with anyone who has the link; `none` leaves sharing to the teacher.'
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [file_ids], properties: { file_ids: { type: array, maxItems: 20, items: { type: string } }, sharing: { type: string, enum: [students, link, none], default: students } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { files: { type: array, items: { $ref: '#/components/schemas/ClassroomDriveFile' } } } } } } }, '403': { description: '`drive_no_access`' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/classrooms/{id}/drive-files/{file}:
    patch:
      operationId: patchTeacherClassroomDriveFile
      tags: [drive, classrooms]
      summary: Change how a file is shared
      parameters: [{ $ref: '#/components/parameters/id' }, { name: file, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { sharing: { type: string, enum: [students, link, none] } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { files: { type: array, items: { $ref: '#/components/schemas/ClassroomDriveFile' } } } } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Invalid' } }
    delete:
      operationId: deleteTeacherClassroomDriveFile
      tags: [drive, classrooms]
      summary: Remove a file from the classroom, taking back what the platform shared; it stays in Drive
      parameters: [{ $ref: '#/components/parameters/id' }, { name: file, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: 'Removed' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/sessions/{id}/drive-export:
    post:
      operationId: postTeacherSessionDriveExport
      tags: [drive, analytics]
      summary: Save a session's results to Drive, as a Google Sheet in the results folder
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '201': { description: 'Saved', content: { application/json: { schema: { $ref: '#/components/schemas/DriveExport' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: '`drive_not_connected` or `drive_reconnect`' }, '502': { description: '`drive_unavailable`' } }
  /api/teacher/polls/{id}/drive-export:
    post:
      operationId: postTeacherPollDriveExport
      tags: [drive, polls]
      summary: Save a poll's answers to Drive, as a Google Sheet in the results folder
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '201': { description: 'Saved', content: { application/json: { schema: { $ref: '#/components/schemas/DriveExport' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: '`drive_not_connected` or `drive_reconnect`' } }
  /api/my/classrooms/{id}/drive-files:
    get:
      operationId: getMyClassroomDriveFiles
      tags: [drive, classrooms]
      summary: A classroom's Drive files, for its actively enrolled students
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { files: { type: array, items: { $ref: '#/components/schemas/ClassroomDriveFile' } } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/meeting-limits:
    get:
      operationId: getTeacherMeetingLimits
      tags: [meetings]
      summary: What an admin allows for meetings; 0 is unlimited (D-72)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/MeetingLimits' } } } } }
  /api/teacher/meetings:
    get:
      operationId: getTeacherMeetings
      tags: [meetings]
      summary: Your meetings, newest first, with how many people are in each now (D-69)
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/q' }
        - { $ref: '#/components/parameters/dir' }
        - { name: sort, in: query, schema: { type: string, enum: [created, title, status] } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer }, page: { type: integer }, size: { type: integer }, meetings: { type: array, items: { $ref: '#/components/schemas/Meeting' } } } } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: postTeacherMeetings
      tags: [meetings]
      summary: Open a meeting (D-69)
      description: With a classroom, only you and its enrolled students may join; without one, anyone signed in who has the code.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string, maxLength: 120 }, classroom_id: { type: string, format: uuid, nullable: true }, max_people: { type: integer, minimum: 0, default: 6, description: 'Within the admin''s limit (GET /api/teacher/meeting-limits); 0 is no limit, where the admin allows it. Everyone sends to everyone, so meetings stay small' } } } } } }
      responses: { '201': { description: 'Opened', content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/meetings/{id}/end:
    post:
      operationId: postTeacherMeetingsEnd
      tags: [meetings]
      summary: End a meeting for everyone (D-69)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Ended' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/meetings/{id}/attendance:
    get:
      operationId: getTeacherMeetingsAttendance
      tags: [meetings]
      summary: Who came to a meeting, when, how often, and who is in it now (D-69)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { attendance: { type: array, items: { $ref: '#/components/schemas/MeetingAttendance' } } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/meetings/{code}:
    get:
      operationId: getMeetingsByCode
      tags: [meetings]
      summary: Check you may join a meeting, and get its ICE servers (D-69)
      parameters: [{ $ref: '#/components/parameters/code' }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/MeetingAccess' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'The meeting is for one classroom (`not_in_classroom`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: 'The meeting has ended (`meeting_ended`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /internal/tutoring/access:
    post:
      operationId: postInternalTutoringAccess
      tags: [tutoring]
      summary: 'For the tutoring service only: how a person may take part in a classroom (TS-NFR-51)'
      description: Not under /api, so the public proxy never forwards it; it also needs a one-minute HS256 service token (issuer tutoring, audience quiz-platform) signed with the shared secret. Anything else gets 404. Joining may enrol a student, as joining a quiz does (BR-02); refusals keep the platform's codes (not_enrolled, enrolment_pending, enrolment_rejected).
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [classroom_id, user_id], properties: { classroom_id: { type: string, format: uuid }, user_id: { type: string, format: uuid } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { classroom_id: { type: string }, classroom_name: { type: string }, teacher_id: { type: string }, archived: { type: boolean }, role: { type: string, enum: [teacher, student] } } } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /internal/tutoring/teacher:
    post:
      operationId: postInternalTutoringTeacher
      tags: [tutoring]
      summary: 'For the tutoring service only: an active teacher by email, for co-teachers (TS-FR-70)'
      description: Same protection as /internal/tutoring/access. Returns only the id and name; anyone else is 404.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }

  # ---------------- teacher settings ----------------
  /api/teacher/settings:
    get:
      operationId: getTeacherSettings
      tags: [settings]
      summary: My teacher-level defaults and what they resolve to
      responses: { '200': { $ref: '#/components/responses/Layer' } }
    put:
      operationId: putTeacherSettings
      tags: [settings]
      summary: Set my teacher-level defaults
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Overrides' } } } }
      responses: { '200': { $ref: '#/components/responses/Layer' }, '422': { $ref: '#/components/responses/Invalid' } }

  # ---------------- classrooms ----------------
  /api/teacher/classrooms:
    get:
      operationId: getTeacherClassrooms
      tags: [classrooms]
      summary: My classrooms
      parameters: [{ name: archived, in: query, description: '`1` to include archived', schema: { type: string, enum: ['1'] } }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [created, name] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, classrooms: { type: array, items: { $ref: '#/components/schemas/Classroom' } } } } } } } }
    post:
      operationId: postTeacherClassrooms
      tags: [classrooms]
      summary: Create a classroom (FR-CLS-01)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassroomInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Classroom' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/classrooms/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherClassroomsById
      tags: [classrooms]
      summary: A classroom with effective settings
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Classroom' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: patchTeacherClassroomsById
      tags: [classrooms]
      summary: Update name, description or settings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassroomInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Classroom' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
    delete:
      operationId: deleteTeacherClassroomsById
      tags: [classrooms]
      summary: Delete a classroom (refused when it has session results; archive instead)
      responses: { '204': { description: 'Deleted' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/teacher/classrooms/{id}/archive:
    post: { operationId: postTeacherClassroomsArchive, tags: [classrooms], summary: Archive a classroom, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '204': { description: 'Archived' } } }
  /api/teacher/classrooms/{id}/unarchive:
    post: { operationId: postTeacherClassroomsUnarchive, tags: [classrooms], summary: Unarchive a classroom, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '204': { description: 'Unarchived' } } }
  /api/teacher/classrooms/{id}/join-code:
    post:
      operationId: postTeacherClassroomsJoinCode
      tags: [classrooms]
      summary: Generate a new classroom join code (the old one stops working)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { join_code: { type: string } } } } } } }
  /api/teacher/classrooms/{id}/enrolments:
    get:
      operationId: getTeacherClassroomsEnrolments
      tags: [classrooms]
      summary: Students enrolled in a classroom
      parameters: [{ $ref: '#/components/parameters/id' }, { name: status, in: query, schema: { type: string, enum: [pending, active, rejected, removed] } }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [joined, name, number, status] } }, { name: category, in: query, description: 'Only students in this category', schema: { type: string, format: uuid } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, enrolments: { type: array, items: { $ref: '#/components/schemas/Enrolment' } } } } } } } }
  /api/teacher/enrolments/{id}:
    patch:
      operationId: patchTeacherEnrolmentsById
      tags: [classrooms]
      summary: Approve, reject or remove an enrolment, or correct the student ID (FR-CLS-04)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [active, rejected, removed] }, student_number: { type: string } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Enrolment' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/classrooms/{id}/categories:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherClassroomsCategories
      tags: [classrooms]
      summary: Student categories of a classroom, with member counts (V2-03)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { categories: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } } }
    post:
      operationId: postTeacherClassroomsCategories
      tags: [classrooms]
      summary: Create a category; without a color, the next palette slot is used
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      operationId: patchTeacherCategoriesById
      tags: [classrooms]
      summary: Rename or recolour a category
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      operationId: deleteTeacherCategoriesById
      tags: [classrooms]
      summary: Delete a category (students stay enrolled)
      responses: { '204': { description: 'Deleted' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/categories/{id}/members:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: postTeacherCategoriesMembers
      tags: [classrooms]
      summary: Add students to, or remove them from, a category (enrolments of the same classroom only)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enrolment_ids, assigned], properties: { enrolment_ids: { type: array, items: { type: string, format: uuid } }, assigned: { type: boolean } } } } } }
      responses: { '200': { description: 'Rows changed', content: { application/json: { schema: { type: object, properties: { affected: { type: integer } } } } } } }
  /api/teacher/classrooms/{id}/modules:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherClassroomsModules
      tags: [classrooms]
      summary: Modules of a classroom, in order
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [position, name] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, modules: { type: array, items: { $ref: '#/components/schemas/Module' } } } } } } } }
    post:
      operationId: postTeacherClassroomsModules
      tags: [classrooms]
      summary: Create a module (FR-CLS-02)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NodeInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Module' } } } } }
  /api/teacher/modules/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      operationId: patchTeacherModulesById
      tags: [classrooms]
      summary: Rename, reorder or configure a module
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NodeInput' } } } }
      responses: { '204': { description: 'Updated' } }
    delete: { operationId: deleteTeacherModulesById, tags: [classrooms], summary: Delete a module, responses: { '204': { description: 'Deleted' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/teacher/modules/{id}/topics:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherModulesTopics
      tags: [classrooms]
      summary: Topics of a module, in order
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [position, name] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, topics: { type: array, items: { $ref: '#/components/schemas/Topic' } } } } } } } }
    post:
      operationId: postTeacherModulesTopics
      tags: [classrooms]
      summary: Create a topic
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NodeInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Topic' } } } } }
  /api/teacher/topics/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherTopicsById
      tags: [classrooms]
      summary: A topic with its classroom and module
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/TopicDetail' } } } } }
    patch:
      operationId: patchTeacherTopicsById
      tags: [classrooms]
      summary: Rename, reorder or configure a topic
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NodeInput' } } } }
      responses: { '204': { description: 'Updated' } }
    delete: { operationId: deleteTeacherTopicsById, tags: [classrooms], summary: Delete a topic (refused while it has quizzes), responses: { '204': { description: 'Deleted' }, '409': { $ref: '#/components/responses/Conflict' } } }

  # ---------------- quizzes ----------------
  /api/teacher/topics/{id}/quizzes:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherTopicsQuizzes
      tags: [quizzes]
      summary: Quizzes of a topic
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [created, title, status] } }, { name: status, in: query, schema: { type: string, enum: [draft, ready, archived] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, quizzes: { type: array, items: { $ref: '#/components/schemas/Quiz' } } } } } } } }
    post:
      operationId: postTeacherTopicsQuizzes
      tags: [quizzes]
      summary: Create a quiz (FR-QZ-01)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuizInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Quiz' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/quizzes/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherQuizzesById
      tags: [quizzes]
      summary: A quiz with effective settings
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Quiz' } } } } }
    patch:
      operationId: patchTeacherQuizzesById
      tags: [quizzes]
      summary: Update title, description or settings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuizInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Quiz' } } } } }
    delete:
      operationId: deleteTeacherQuizzesById
      tags: [quizzes]
      summary: Delete a quiz, or archive it if it has session results (BR-16)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean }, archived: { type: boolean } } } } } } }
  /api/teacher/quizzes/{id}/status:
    post:
      operationId: postTeacherQuizzesStatus
      tags: [quizzes]
      summary: Mark Ready or back to draft (UC-01 step 7)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [draft, ready] }, accept_warnings: { type: boolean, description: 'Accept broken resource links (UC-01 6a)' } } } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Quiz' } } } }
        '409': { description: '`quiz_not_ready` or `quiz_has_warnings`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/teacher/bank:
    get:
      operationId: getTeacherBank
      tags: [quizzes]
      summary: Your question bank (created on first use, D-66)
      description: A quiz of kind `bank` with no topic. Add, edit and import its questions with the quiz question routes; quizzes draw from it through pools. It can't be marked ready, run as a session or deleted.
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Quiz' } } } } }
  /api/teacher/quizzes/{id}/pools:
    get:
      operationId: getTeacherQuizPools
      tags: [quizzes]
      summary: A quiz's pool rules and the categories it can draw from (D-66)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PoolInfo' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      operationId: putTeacherQuizPools
      tags: [quizzes]
      summary: Replace a quiz's pool rules
      description: Each rule draws `count` questions (0 = all) from one category of the quiz or of your bank. Quiz questions in a category without a rule are always asked. Rules are checked against what the quiz and bank hold when the quiz is marked ready and when a session starts.
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { pools: { type: array, items: { $ref: '#/components/schemas/PoolRule' } } } } } } }
      responses:
        '200': { description: 'Saved', content: { application/json: { schema: { $ref: '#/components/schemas/PoolInfo' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/teacher/quizzes/{id}/readiness:
    get:
      operationId: getTeacherQuizzesReadiness
      tags: [quizzes]
      summary: What blocks the quiz from being Ready
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { blocking: { type: array, items: { type: string } }, warnings: { type: array, items: { type: string } } } } } } } }
  /api/teacher/quizzes/{id}/preview:
    get:
      operationId: getTeacherQuizzesPreview
      tags: [quizzes]
      summary: The quiz as a student sees it, without keys (FR-QZ-10)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { questions: { type: array, items: { $ref: '#/components/schemas/StudentQuestion' } } } } } } } }
  /api/teacher/quizzes/{id}/questions:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherQuizzesQuestions
      tags: [quizzes]
      summary: Questions in order, with keys and resources
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { questions: { type: array, items: { $ref: '#/components/schemas/Question' } } } } } } } }
    post:
      operationId: postTeacherQuizzesQuestions
      tags: [quizzes]
      summary: Add one question (FR-QZ-04)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/quizzes/{id}/questions/order:
    put:
      operationId: putTeacherQuizzesQuestionsOrder
      tags: [quizzes]
      summary: Reorder questions (list every id once)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { '204': { description: 'Reordered' }, '400': { $ref: '#/components/responses/Error' } }
  /api/teacher/quizzes/{id}/questions/import:
    post:
      operationId: postTeacherQuizzesQuestionsImport
      tags: [quizzes]
      summary: Bulk import questions from CSV (FR-QZ-05, BA §10.3)
      description: Valid rows are imported; invalid rows are reported with row numbers and reasons. Limits 2 MB and 1000 rows.
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { $ref: '#/components/requestBodies/CSV' }
      responses: { '200': { description: 'Report', content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } } }, '400': { $ref: '#/components/responses/Error' } }
  /api/teacher/quizzes/{id}/resources/import:
    post:
      operationId: postTeacherQuizzesResourcesImport
      tags: [quizzes]
      summary: Attach resources from a mapping CSV (FR-QZ-06, BA §10.4)
      description: 'Columns `resource_name,url,alt_text`; names are `<question_code>_<Q|O|F>_<n>`.'
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { $ref: '#/components/requestBodies/CSV' }
      responses: { '200': { description: 'Report', content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } } } }
  /api/teacher/quizzes/{id}/resources/check:
    post:
      operationId: postTeacherQuizzesResourcesCheck
      tags: [quizzes]
      summary: Re-check every resource link in the background (FR-QZ-11)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '202': { description: 'Queued' } }
  /api/teacher/questions/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherQuestionsById
      tags: [quizzes]
      summary: One question
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } } }
    put:
      operationId: putTeacherQuestionsById
      tags: [quizzes]
      summary: Replace a question's content (resources are kept)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
    delete: { operationId: deleteTeacherQuestionsById, tags: [quizzes], summary: Delete a question, responses: { '204': { description: 'Deleted' } } }
  /api/teacher/questions/{id}/duplicate:
    post:
      operationId: postTeacherQuestionsDuplicate
      tags: [quizzes]
      summary: Duplicate a question (code gets a -copy suffix)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } } }
  /api/teacher/questions/{id}/resources:
    put:
      operationId: putTeacherQuestionsResources
      tags: [quizzes]
      summary: Attach or replace one resource (image by public URL; BR-15)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses: { '200': { description: 'The updated question', content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/resources/{id}:
    delete: { operationId: deleteTeacherResourcesById, tags: [quizzes], summary: Remove a resource, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '204': { description: 'Deleted' } } }
  /api/teacher/quiz-template.csv:
    get:
      operationId: getTeacherQuizTemplateCsv
      tags: [quizzes]
      summary: Download the CSV template (one example per question type)
      responses: { '200': { description: 'CSV', content: { text/csv: { schema: { type: string } } } } }

  # ---------------- sessions (teacher) ----------------
  /api/teacher/quizzes/{id}/sessions:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherQuizzesSessions
      tags: [sessions]
      summary: Sessions of a quiz
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [created, title, status] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, sessions: { type: array, items: { $ref: '#/components/schemas/Session' } } } } } } } }
    post:
      operationId: postTeacherQuizzesSessions
      tags: [sessions]
      summary: Create a session with its own QR code and short link (FR-SS-01/02)
      description: The quiz must be Ready. Questions and settings are frozen into the session (ADR-14).
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { title: { type: string }, settings: { $ref: '#/components/schemas/Overrides' } } } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/teacher/sessions/{id}:
    get:
      operationId: getTeacherSessionsById
      tags: [sessions]
      summary: Live dashboard snapshot (FR-SS-10)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } } }
  /api/teacher/sessions/{id}/settings:
    put:
      operationId: putTeacherSessionsSettings
      tags: [sessions]
      summary: Replace session-level settings (e.g. countdown before admitting the next group)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Overrides' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '410': { $ref: '#/components/responses/Gone' } }
  /api/teacher/sessions/{id}/admit:
    post:
      operationId: postTeacherSessionsAdmit
      tags: [sessions]
      summary: Admit waiting students (FR-SS-04); starts their countdown
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { $ref: '#/components/requestBodies/Target' }
      responses: { '200': { $ref: '#/components/responses/Affected' }, '410': { $ref: '#/components/responses/Gone' } }
  /api/teacher/sessions/{id}/start:
    post:
      operationId: postTeacherSessionsStart
      tags: [sessions]
      summary: Start the quiz for admitted students (D-53)
      description: >-
        Without `now`, students waiting for the teacher begin their countdown (or start at once with a 0-second
        countdown); students already counting down carry on. With `now`, every selected admitted student starts at
        once. With `all`, students admitted later count down by themselves.
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Target' }, { type: object, properties: { now: { type: boolean } } }] } } }
      responses: { '200': { $ref: '#/components/responses/Affected' }, '410': { $ref: '#/components/responses/Gone' } }
  /api/teacher/sessions/{id}/pause:
    post:
      operationId: postTeacherSessionsPause
      tags: [sessions]
      summary: Pause running attempts; timers stop (FR-SS-08)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { $ref: '#/components/requestBodies/Target' }
      responses: { '200': { $ref: '#/components/responses/Affected' } }
  /api/teacher/sessions/{id}/resume:
    post:
      operationId: postTeacherSessionsResume
      tags: [sessions]
      summary: Resume paused attempts
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { $ref: '#/components/requestBodies/Target' }
      responses: { '200': { $ref: '#/components/responses/Affected' } }
  /api/teacher/sessions/{id}/extend:
    post:
      operationId: postTeacherSessionsExtend
      tags: [sessions]
      summary: Extend time for students or the whole session (FR-SS-09)
      description: With `all`, the extension is session-wide and also applies to students who start later.
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Target' }, { type: object, required: [seconds], properties: { seconds: { type: integer, minimum: 1, maximum: 86400 } } }] } } }
      responses: { '200': { $ref: '#/components/responses/Affected' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/sessions/{id}/end:
    post:
      operationId: postTeacherSessionsEnd
      tags: [sessions]
      summary: End the session (FR-SS-11); running attempts are submitted
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Ended' }, '410': { $ref: '#/components/responses/Gone' } }
  /api/teacher/sessions/{id}/events:
    get:
      operationId: getTeacherSessionsEvents
      tags: [sessions]
      summary: Integrity log (joins, admissions, pauses, extensions, violations, reinstatements)
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [time] } }, { name: kind, in: query, schema: { type: string } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, events: { type: array, items: { $ref: '#/components/schemas/SessionEvent' } } } } } } } }
  /api/teacher/sessions/{id}/release:
    post:
      operationId: postTeacherSessionsRelease
      tags: [sessions, marking]
      summary: Release results to students now
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Released' } }
  /api/teacher/sessions/{id}/unrelease:
    post:
      operationId: postTeacherSessionsUnrelease
      tags: [sessions, marking]
      summary: Hide released results again
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Hidden' } }
  /api/teacher/attempts/{id}/reinstate:
    post:
      operationId: postTeacherAttemptsReinstate
      tags: [sessions]
      summary: Reinstate an invalidated attempt with a logged reason (FR-SS-12, BR-08)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '410': { $ref: '#/components/responses/Gone' } }

  # ---------------- marking ----------------
  /api/teacher/sessions/{id}/teams:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherSessionsTeams
      tags: [sessions]
      summary: Teams with their members, and students without a team (D-44)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/TeamsView' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: postTeacherSessionsTeams
      tags: [sessions]
      summary: Add a team (default name "Team N"; at most 50)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TeamInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/TeamInfo' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/sessions/{id}/teams/generate:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: postTeacherSessionsTeamsGenerate
      tags: [sessions]
      summary: Form teams at random (balanced) or from the classroom's categories
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [from], properties: { from: { type: string, enum: [random, categories] }, count: { type: integer, minimum: 2, maximum: 50 }, reassign: { type: boolean, description: 'Also move students who already have a team' } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/TeamsView' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/sessions/{id}/teams/members:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: postTeacherSessionsTeamsMembers
      tags: [sessions]
      summary: Move attempts to a team (empty team_id removes them), or make one the captain
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [attempt_ids], properties: { attempt_ids: { type: array, items: { type: string, format: uuid } }, team_id: { type: [string, 'null'] }, captain: { type: boolean } } } } } }
      responses: { '204': { description: 'Done' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/sessions/{id}/teams/standings:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherSessionsTeamsStandings
      tags: [marking]
      summary: Teams ranked by their combined marks (team_acceptance, team_calc)
      description: Marks arrive as members finish. Teams are ranked by percentage of their maximum, so totals stay fair between teams of different sizes. Invalidated attempts never count.
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { teams: { type: array, items: { $ref: '#/components/schemas/TeamStanding' } } } } } } } }
  /api/teacher/session-teams/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      operationId: patchTeacherSessionTeamsById
      tags: [sessions]
      summary: Rename or recolour a team
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeamInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/TeamInfo' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
    delete:
      operationId: deleteTeacherSessionTeamsById
      tags: [sessions]
      summary: Delete a team; its members carry on without one
      responses: { '204': { description: 'Deleted' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/sessions/{id}/results:
    get:
      operationId: getTeacherSessionsResults
      tags: [marking]
      summary: Every finished attempt with its marks, for review (FR-EV-06)
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [joined, number, score] } }, { name: review, in: query, description: '`1`: only results with marks to review', schema: { type: string, enum: ['1'] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, results: { type: array, items: { $ref: '#/components/schemas/AttemptResult' } } } } } } } }
  /api/teacher/marks/{attempt}/{question}:
    put:
      operationId: putTeacherMarksById
      tags: [marking]
      summary: Override a mark and/or feedback (audited)
      parameters: [{ $ref: '#/components/parameters/attempt' }, { $ref: '#/components/parameters/question' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { score: { type: number }, feedback: { type: string, maxLength: 5000 } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/MarkView' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/marks/{attempt}/{question}/remark:
    post:
      operationId: postTeacherMarksRemark
      tags: [marking]
      summary: Re-run LLM marking for one answer (FR-EV-09)
      parameters: [{ $ref: '#/components/parameters/attempt' }, { $ref: '#/components/parameters/question' }]
      responses: { '202': { description: 'Queued' }, '400': { $ref: '#/components/responses/Error' }, '409': { description: No usable API key } }
  /api/teacher/sessions/{id}/llm-estimate:
    get:
      operationId: getTeacherSessionsLlmEstimate
      tags: [marking]
      summary: Answers needing the LLM and an approximate token count (NFR-16)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { answers: { type: integer }, estimated_tokens: { type: integer } } } } } } }

  # ---------------- llm keys ----------------
  /api/teacher/llm-keys:
    get:
      operationId: getTeacherLlmKeys
      tags: [llm-keys]
      summary: My keys, masked to the last 4 characters (AC-11)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { $ref: '#/components/schemas/LLMKey' } } } } } } } }
    post:
      operationId: postTeacherLlmKeys
      tags: [llm-keys]
      summary: Add a key (encrypted; it can never be read back)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LLMKeyInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/LLMKey' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/llm-keys/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      operationId: patchTeacherLlmKeysById
      tags: [llm-keys]
      summary: Change label, model or default flag
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { label: { type: string }, model: { type: string }, is_default: { type: boolean } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/LLMKey' } } } } }
    delete: { operationId: deleteTeacherLlmKeysById, tags: [llm-keys], summary: Delete a key, responses: { '204': { description: 'Deleted' } } }
  /api/teacher/llm-keys/{id}/test:
    post:
      operationId: postTeacherLlmKeysTest
      tags: [llm-keys]
      summary: Send a tiny marking request to check the key works
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'Result recorded on the key', content: { application/json: { schema: { $ref: '#/components/schemas/LLMKey' } } } } }

  # ---------------- analytics ----------------
  /api/teacher/sessions/{id}/analytics:
    get:
      operationId: getTeacherSessionsAnalytics
      tags: [analytics]
      summary: Session analytics by class, question and student (FR-RS-03)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/SessionStats' } } } } }
  /api/teacher/quizzes/{id}/analytics:
    get:
      operationId: getTeacherQuizzesAnalytics
      tags: [analytics]
      summary: Quiz analytics across sessions, with session comparison
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/QuizStats' } } } } }
  /api/teacher/sessions/{id}/export.csv:
    get:
      operationId: getTeacherSessionsExportCsv
      tags: [analytics]
      summary: Export session results as CSV (FR-RS-05; formula injection neutralised)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'CSV', content: { text/csv: { schema: { type: string } } } } }
  /api/teacher/share-links:
    get:
      operationId: getTeacherShareLinks
      tags: [analytics]
      summary: My public links (tokens are never listed)
      parameters: [{ name: target_id, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [created] } }, { name: scope, in: query, description: 'Only these scopes, comma-separated (e.g. session,quiz)', schema: { type: string } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, links: { type: array, items: { $ref: '#/components/schemas/ShareLink' } } } } } } } }
    post:
      operationId: postTeacherShareLinks
      tags: [analytics]
      summary: Create a public link (FR-RS-04); the token is returned once
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShareInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/ShareLink' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/share-links/{id}:
    delete: { operationId: deleteTeacherShareLinksById, tags: [analytics], summary: Revoke a link, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '204': { description: 'Revoked' } } }
  /api/teacher/share-links/{id}/regenerate:
    post:
      operationId: postTeacherShareLinksRegenerate
      tags: [analytics]
      summary: Replace the token; the old URL stops working
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ShareLink' } } } } }
  /api/public/live/{token}:
    get:
      operationId: getPublicLiveById
      tags: [public]
      summary: Live leaderboards for a live_session or live_poll link (V2-08, D-45)
      description: Poll `refresh_ms` later for fresh data; views are cached for 2 s per link. Students appear by student ID or as "Student N", poll participants by nickname or as "Participant N"; names and emails never appear.
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'OK (sent with `X-Robots-Tag: noindex`)', content: { application/json: { schema: { $ref: '#/components/schemas/LiveView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: 'Expired, revoked, or the poll or session is gone', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/public/results/{token}:
    get:
      operationId: getPublicResultsById
      tags: [public]
      summary: Public results page data (no names or emails; BR-13)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'OK (sent with `X-Robots-Tag: noindex`)', content: { application/json: { schema: { $ref: '#/components/schemas/PublicView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: 'Expired or revoked', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------- student ----------------
  /api/join/classrooms/{code}:
    get:
      operationId: getJoinClassroomsById
      tags: [student]
      summary: Classroom join preview (any logged-in user)
      parameters: [{ $ref: '#/components/parameters/code' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ClassroomPreview' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/enrolments:
    post:
      operationId: postEnrolments
      tags: [student]
      summary: Enrol in a classroom by join code (FR-CLS-03/05)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [join_code], properties: { join_code: { type: string }, student_number: { type: string, maxLength: 64 } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Enrolment' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/my/classrooms:
    get:
      operationId: getMyClassrooms
      tags: [student]
      summary: Classrooms I am enrolled in
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [name] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, classrooms: { type: array, items: { type: object, properties: { classroom_id: { type: string }, name: { type: string }, status: { type: string }, student_number: { type: [string, 'null'] } } } } } } } } } }
  /api/my/data:
    get:
      operationId: getMyData
      tags: [student]
      summary: Download everything stored about me (NFR-04)
      responses: { '200': { description: 'JSON export', content: { application/json: { schema: { type: object } } } } }
  /api/join/sessions/{code}:
    parameters: [{ $ref: '#/components/parameters/code' }]
    get:
      operationId: getJoinSessionsById
      tags: [student]
      summary: Session join preview (student role)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/JoinPreview' } } } }, '410': { $ref: '#/components/responses/Gone' } }
    post:
      operationId: postJoinSessions
      tags: [student]
      summary: Join the session's waiting room (FR-SS-03, BR-01, BR-02)
      description: Auto-enrols when the classroom allows it. Under auto-admit the student is admitted at once.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { student_number: { type: string }, team_id: { type: string, description: 'team_mode=self: required once teams exist' } } } } } }
      responses:
        '200': { description: 'Current state', content: { application/json: { schema: { $ref: '#/components/schemas/StudentState' } } } }
        '403': { description: '`not_enrolled`, `enrolment_pending` or `enrolment_rejected`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/attempts/{id}:
    get:
      operationId: getAttemptsById
      tags: [student]
      summary: Current attempt state (REST fallback for the WebSocket)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { $ref: '#/components/responses/State' } }
  /api/attempts/{id}/start:
    post:
      operationId: postAttemptsStart
      tags: [student]
      summary: Start during the countdown (FR-SS-05)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { $ref: '#/components/responses/State' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/attempts/{id}/answers/{qid}:
    put:
      operationId: putAttemptsAnswersById
      tags: [student]
      summary: Save an answer (NFR-11); older `seq` values never overwrite newer ones
      parameters: [{ $ref: '#/components/parameters/id' }, { name: qid, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [response], properties: { response: { $ref: '#/components/schemas/Response' }, seq: { type: integer, format: int64 } } } } } }
      responses:
        '200': { description: 'Saved', content: { application/json: { schema: { type: object, properties: { saved: { type: boolean }, server_time: { type: integer, format: int64 } } } } } }
        '409': { description: 'Paused, time up, or not the current question (`wrong_state`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/attempts/{id}/advance:
    post:
      operationId: postAttemptsAdvance
      tags: [student]
      summary: Move past the current question; submits after the last (idempotent by question id)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [question_id], properties: { question_id: { type: string, format: uuid } } } } } }
      responses: { '200': { $ref: '#/components/responses/State' } }
  /api/attempts/{id}/goto:
    post:
      operationId: postAttemptsGoto
      tags: [student]
      summary: Jump to a question (only when navigation is not one-way; BR-09)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [index], properties: { index: { type: integer, minimum: 0 } } } } } }
      responses: { '200': { $ref: '#/components/responses/State' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/attempts/{id}/flags/{qid}:
    put:
      operationId: putAttemptsFlag
      tags: [student]
      summary: Flag a question to come back to, or clear the flag (D-61; only when navigation is not one-way)
      parameters: [{ $ref: '#/components/parameters/id' }, { name: qid, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [flagged], properties: { flagged: { type: boolean } } } } } }
      responses: { '200': { $ref: '#/components/responses/State' }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/attempts/{id}/submit:
    post:
      operationId: postAttemptsSubmit
      tags: [student]
      summary: Finish the attempt now
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { $ref: '#/components/responses/State' } }
  /api/attempts/{id}/violations:
    post:
      operationId: postAttemptsViolations
      tags: [student]
      summary: Report leaving the quiz (FR-PR-02/03); the configured policy is applied
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ViolationInput' } } } }
      responses: { '204': { description: 'Recorded' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/my/attempts:
    get:
      operationId: getMyAttempts
      tags: [student]
      summary: My attempts and whether their results are released
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [created] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, attempts: { type: array, items: { $ref: '#/components/schemas/StudentAttempt' } } } } } } } }
  /api/my/attempts/{id}/result:
    get:
      operationId: getMyAttemptsResult
      tags: [student]
      summary: My released result with answers, correct answers and feedback as configured (FR-EV-08)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/StudentResult' } } } }
        '403': { description: '`results_not_released` (BR-12)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------- realtime ----------------
  /ws/attempts/{id}:
    get:
      operationId: getWsAttemptsById
      tags: [realtime]
      summary: Student WebSocket (upgrade)
      description: |
        Server → client: `state` (full `StudentState`, sent on connect and on every change),
        `time` (`server_time` every 15 s), `pong` (`t` echoed, `server_time`), `error` (`code`, `message`).
        Client → server: `{"type":"ping","t":<ms>}` about every 10 s, `{"type":"start"}`,
        `{"type":"violation","kind":"tab_hidden|window_blur|page_close|fullscreen_exit","client_ts":<ms>}`.
        A socket that closes during an attempt and does not reconnect within `disconnect_grace_sec`
        counts as a `disconnected` violation. The upgrade checks `Origin`.
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '101': { description: 'Switching protocols' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/polls:
    get:
      operationId: getTeacherPolls
      tags: [polls]
      summary: The teacher's polls, newest first
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [created, title, status] } }, { name: status, in: query, schema: { type: string, enum: [draft, open, closed] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, polls: { type: array, items: { $ref: '#/components/schemas/Poll' } } } } } } } }
    post:
      operationId: postTeacherPolls
      tags: [polls]
      summary: Create a poll (draft). Defaults to anonymous, anyone with the code, self-paced, results after answering.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PollInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/Poll' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/polls/{id}:
    get:
      operationId: getTeacherPollsById
      tags: [polls]
      summary: A poll with its questions
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Poll' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      operationId: putTeacherPollsById
      tags: [polls]
      summary: Change title, classroom or settings. Identity can't change once people have joined.
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PollInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Poll' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
    delete:
      operationId: deleteTeacherPollsById
      tags: [polls]
      summary: Delete the poll with every answer and file
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Deleted' } }
  /api/teacher/polls/{id}/status:
    post:
      operationId: postTeacherPollsStatus
      tags: [polls]
      summary: Open, close or return the poll to draft
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [open, closed, draft] } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Poll' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/teacher/polls/{id}/present:
    post:
      operationId: postTeacherPollsPresent
      tags: [polls]
      summary: Presenter pacing — show question `index` to everyone, optionally revealing its results and correct answer
      description: Moving to another question restarts its clock (time limit, speed bonus); calling again with the same index only changes what is revealed.
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { index: { type: integer }, revealed: { type: boolean }, answers_revealed: { type: boolean, description: 'show_answers=presenter: show the answer key of this question' } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Poll' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/polls/{id}/reset:
    post:
      operationId: postTeacherPollsReset
      tags: [polls]
      summary: Delete every participant, answer and file; keep the questions
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Reset' } }
  /api/teacher/polls/{id}/questions:
    post:
      operationId: postTeacherPollsQuestions
      tags: [polls]
      summary: Add a question (any of the 20 types), also while the poll runs
      description: Open polls show the new question to participants on the next live update (within half a second). `after_current` inserts it after the question being presented; `present` (presenter pacing) moves everyone to it.
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/PollQuestionInput' }, { type: object, properties: { after_current: { type: boolean }, after_id: { type: string, description: 'Insert after this question' }, present: { type: boolean } } }] } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/PollQuestion' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/polls/{id}/questions/order:
    put:
      operationId: putTeacherPollsQuestionsOrder
      tags: [polls]
      summary: Reorder questions
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { '204': { description: 'Reordered' } }
  /api/teacher/poll-questions/{id}:
    put:
      operationId: putTeacherPollQuestionsById
      tags: [polls]
      summary: Update a question; its type can't change once it has answers
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PollQuestionInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PollQuestion' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      operationId: deleteTeacherPollQuestionsById
      tags: [polls]
      summary: Delete a question and its answers
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '204': { description: 'Deleted' } }
  /api/teacher/polls/{id}/results:
    get:
      operationId: getTeacherPollsResults
      tags: [polls]
      summary: Full live results (names of identified participants, moderated items flagged, file list)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PollTeacherResults' } } } } }
  /api/teacher/polls/{id}/export.csv:
    get:
      operationId: getTeacherPollsExport
      tags: [polls]
      summary: One row per participant, one column per question (formula-safe)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'CSV', content: { text/csv: { schema: { type: string } } } } }
  /api/teacher/polls/{id}/participants:
    get:
      operationId: getTeacherPollsParticipants
      tags: [polls]
      summary: Participants of a poll, paginated (PL-FR-02)
      description: Number, nickname, real name of identified participants, group, answers given and points.
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/size' }, { $ref: '#/components/parameters/q' }, { $ref: '#/components/parameters/dir' }, { name: sort, in: query, schema: { type: string, enum: [joined, name, answered, score] } }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, participants: { type: array, items: { type: object, properties: { participant_id: { type: string, format: uuid }, number: { type: integer }, name: { type: string }, nickname: { type: string }, real_name: { type: string }, group: { type: string }, answered: { type: integer }, score: { type: number }, joined_at: { type: string, format: date-time } } } } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/polls/{id}/questions/{qid}/answers:
    get:
      operationId: getTeacherPollsQuestionAnswers
      tags: [polls]
      summary: Every answer to a question, for moderation, paginated (PL-FR-02)
      description: Live results keep the newest 300 text answers; this reaches all of them, newest first by default.
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { name: qid, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/q' }
        - { $ref: '#/components/parameters/dir' }
        - { name: hidden, in: query, description: 'Only hidden (`true`) or only shown (`false`) answers', schema: { type: string, enum: ['true', 'false'] } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { type: object, properties: { total: { type: integer, description: 'Rows matching, on all pages' }, page: { type: integer }, size: { type: integer }, answers: { type: array, items: { type: object, properties: { participant_id: { type: string, format: uuid }, name: { type: string }, real_name: { type: string }, text: { type: string }, hidden: { type: boolean }, at: { type: string, format: date-time } } } } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/polls/{id}/moderation:
    post:
      operationId: postTeacherPollsModeration
      tags: [polls]
      summary: Hide (or show again) one participant's answer or a word from a word cloud, or rename a participant
      description: Hidden answers don't count towards scores. To rename, send `participant_id` and `nickname` without `question_id`; an empty nickname falls back to "Participant N".
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { question_id: { type: string, format: uuid }, participant_id: { type: string, format: uuid }, word: { type: string }, hidden: { type: boolean }, nickname: { type: string, maxLength: 30 } } } } } }
      responses: { '204': { description: 'Done' } }
  /api/teacher/polls/{id}/board:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherPollsBoard
      tags: [polls]
      summary: The whiteboard with every stroke and who may draw (V2-09, D-47)
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/BoardView' } } } } }
  /api/teacher/polls/{id}/board/access:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      operationId: putTeacherPollsBoardAccess
      tags: [polls]
      summary: Show or hide the board, and choose who may draw
      description: Ids that aren't this poll's groups or participants are dropped.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BoardAccess' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/BoardAccess' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/polls/{id}/board/strokes:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: postTeacherPollsBoardStrokes
      tags: [polls]
      summary: Draw (up to 20 strokes per request)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [strokes], properties: { strokes: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/BoardStroke' } } } } } } }
      responses: { '201': { description: 'Saved and pushed to every open screen', content: { application/json: { schema: { type: object, properties: { strokes: { type: array, items: { $ref: '#/components/schemas/BoardStroke' } } } } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/polls/{id}/board/erase:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: postTeacherPollsBoardErase
      tags: [polls]
      summary: Erase any strokes, or undo the teacher's own gesture
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: integer } }, gesture: { type: string, description: 'Undo: remove a whole gesture' } } } } } }
      responses: { '200': { description: 'Removed', content: { application/json: { schema: { type: object, properties: { removed: { type: array, items: { type: integer } } } } } } } }
  /api/teacher/polls/{id}/board/clear:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: postTeacherPollsBoardClear
      tags: [polls]
      summary: Clear the board for everyone
      responses: { '204': { description: 'Cleared' } }
  /api/teacher/polls/{id}/groups:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      operationId: getTeacherPollsGroups
      tags: [polls]
      summary: Groups with their members, and participants without a group
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PollGroupsView' } } } } }
    post:
      operationId: postTeacherPollsGroups
      tags: [polls]
      summary: Add a group (default name "Group N"; at most 50)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PollGroupInput' } } } }
      responses: { '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/PollGroup' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/polls/{id}/groups/generate:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: postTeacherPollsGroupsGenerate
      tags: [polls]
      summary: Form groups at random (balanced) or from the classroom's categories
      description: Without `reassign`, only participants who have no group are placed. Groups without a captain get their earliest member as captain.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [from], properties: { from: { type: string, enum: [random, categories] }, count: { type: integer, minimum: 2, maximum: 50, description: 'random only' }, reassign: { type: boolean } } } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PollGroupsView' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/polls/{id}/groups/members:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      operationId: postTeacherPollsGroupsMembers
      tags: [polls]
      summary: Move participants to a group (empty group_id removes them), or make one the captain
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [participant_ids], properties: { participant_ids: { type: array, items: { type: string, format: uuid } }, group_id: { type: [string, 'null'] }, captain: { type: boolean } } } } } }
      responses: { '204': { description: 'Done' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/teacher/poll-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      operationId: patchTeacherPollGroupsById
      tags: [polls]
      summary: Rename or recolour a group
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PollGroupInput' } } } }
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PollGroup' } } } }, '422': { $ref: '#/components/responses/Invalid' } }
    delete:
      operationId: deleteTeacherPollGroupsById
      tags: [polls]
      summary: Delete a group; its members become ungrouped
      responses: { '204': { description: 'Deleted' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/teacher/polls/{id}/files/{file}:
    get:
      operationId: getTeacherPollsFile
      tags: [polls]
      summary: Download a file, audio or video answer (owner only; sandboxed)
      parameters: [{ $ref: '#/components/parameters/id' }, { name: file, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: 'The file; images, audio and video inline, other types as attachments' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/polls/{code}:
    get:
      operationId: getPollsByCode
      tags: [polls, public]
      summary: The poll as this participant sees it (own answers, results they may see)
      description: Send `X-Poll-Token` for an anonymous participant. Presenter-paced polls return only the current question.
      security: []
      parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/pollToken' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/PublicPoll' } } } }, '409': { description: 'Draft poll (`poll_not_open`)' } }
  /api/polls/{code}/join:
    post:
      operationId: postPollsJoin
      tags: [polls, public]
      summary: Join. Anonymous participants receive a device token; identified polls need a login.
      description: 'Joining again returns the same participant. Errors: `login_required` (401), `not_enrolled` (403, classroom-only polls), `poll_closed` (409), `rate_limited` (429).'
      security: []
      parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/pollToken' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { identify: { type: boolean, description: 'Optional-identity polls: answer under the logged-in account' }, nickname: { type: string, maxLength: 30, description: 'Shown on the leaderboard; joining again with a new one renames' }, group_id: { type: string, description: 'groups=self: the group to join (required when there are groups); joining again moves you if you have not answered yet' } } } } } }
      responses: { '200': { description: 'Joined', content: { application/json: { schema: { $ref: '#/components/schemas/PollJoinResult' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/polls/{code}/answers/{question}:
    put:
      operationId: putPollsAnswer
      tags: [polls, public]
      summary: Save an answer; an empty value clears it
      description: In scored polls with show_answers=after_answer the response also carries the answer key and this answer's score.
      security: []
      parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/question' }, { $ref: '#/components/parameters/pollToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { value: { $ref: '#/components/schemas/PollAnswer' } } } } } }
      responses: { '200': { description: 'Saved (normalised)', content: { application/json: { schema: { type: object, properties: { value: { $ref: '#/components/schemas/PollAnswer' }, key: { $ref: '#/components/schemas/PollKey' }, score: { $ref: '#/components/schemas/PollScore' } } } } } }, '409': { description: '`poll_closed`, `question_not_active`, `time_up`, `answer_revealed`, `group_answered`, `captain_only` or editing is off' }, '422': { $ref: '#/components/responses/Invalid' } }
  /api/polls/{code}/board:
    get:
      operationId: getPollsBoard
      tags: [polls, public]
      summary: The whiteboard as this participant sees it (empty while hidden)
      security: []
      parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/pollToken' }]
      responses: { '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/BoardView' } } } }, '409': { description: 'Draft poll' } }
  /api/polls/{code}/board/strokes:
    post:
      operationId: postPollsBoardStrokes
      tags: [polls, public]
      summary: Draw, when the teacher allows it
      security: []
      parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/pollToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [strokes], properties: { strokes: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/BoardStroke' } } } } } } }
      responses: { '201': { description: 'Saved and pushed to every open screen', content: { application/json: { schema: { type: object, properties: { strokes: { type: array, items: { $ref: '#/components/schemas/BoardStroke' } } } } } } }, '403': { description: '`cannot_draw`' }, '422': { $ref: '#/components/responses/Invalid' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /api/polls/{code}/board/erase:
    post:
      operationId: postPollsBoardErase
      tags: [polls, public]
      summary: Erase or undo your own strokes
      security: []
      parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/pollToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: integer } }, gesture: { type: string, description: 'Undo: remove a whole gesture' } } } } } }
      responses: { '200': { description: 'Removed', content: { application/json: { schema: { type: object, properties: { removed: { type: array, items: { type: integer } } } } } } }, '403': { description: '`cannot_draw`' } }
  /api/polls/{code}/files/{question}:
    post:
      operationId: postPollsFile
      tags: [polls, public]
      summary: Upload a file, audio or video answer (raw body; name in `X-File-Name`, URL-encoded)
      description: 'Type is decided by content sniffing. Limits: files up to 5 MB (per question), audio 3 MB, video 12 MB, 200 MB per poll.'
      security: []
      parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/question' }, { $ref: '#/components/parameters/pollToken' }, { name: X-File-Name, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { '200': { description: 'Stored', content: { application/json: { schema: { type: object, properties: { value: { $ref: '#/components/schemas/PollAnswer' } } } } } }, '422': { $ref: '#/components/responses/Invalid' } }
  /ws/sessions/{id}:
    get:
      operationId: getWsSessionsById
      tags: [realtime]
      summary: Teacher dashboard WebSocket (upgrade)
      description: |
        Server → client: `dashboard` (full `Dashboard`, on connect and at most every 500 ms while changing),
        `alert` (`attempt_id`, `student_name`, `student_number`, `kind`, `action`, `state`) as soon as a violation happens,
        `session_ended`, `time`, `pong`. Client → server: `ping`.
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '101': { description: 'Switching protocols' }, '404': { $ref: '#/components/responses/NotFound' } }
  /ws/polls/{code}:
    get:
      operationId: getWsPollsByCode
      tags: [realtime, polls]
      summary: Participant poll WebSocket (upgrade; read-only, no identity)
      description: Server → client `update` (a `PublicPoll` without answers) on connect and at most every 500 ms while answers arrive; `deleted`; `pong`. Client → server `ping`.
      security: []
      parameters: [{ $ref: '#/components/parameters/code' }]
      responses: { '101': { description: 'Switching protocols' }, '404': { $ref: '#/components/responses/NotFound' } }
  /ws/teacher/polls/{id}:
    get:
      operationId: getWsTeacherPollsById
      tags: [realtime, polls]
      summary: Presenter WebSocket (upgrade); full live results
      description: Server → client `results` (a `PollTeacherResults`) on connect and at most every 500 ms while changing; `deleted`; `pong`.
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '101': { description: 'Switching protocols' }, '404': { $ref: '#/components/responses/NotFound' } }
  /ws/meet/{code}:
    get:
      operationId: getWsMeetByCode
      tags: [realtime, meetings]
      summary: Meeting signalling WebSocket (upgrade; D-69)
      description: |
        Same checks as `GET /api/meetings/{code}`; a full meeting closes with code 4009. Media goes browser to browser, never here.
        Server → client: `welcome` (`you`, `peers`, `ice_servers`, `meeting`), `joined` (`peer`), `left` (`peer_id`),
        `signal` (`from`, `data`), `state` (`peer_id`, `mic`, `cam`, `screen`, `hand`), `removed`, `replaced` (you joined from another tab), `ended`, `pong`.
        Client → server: `ping`, `signal` (`to`, `data`: an SDP description or ICE candidate), `state`, and for the host `remove` (`peer_id`) and `end`.
        Whiteboard (D-72), kept in memory while the meeting is open: `welcome` carries `board` (`open`, `mode`: host|everyone, `can_draw`, `me`, `strokes`).
        Requests carry a `req` id and are answered with `board_ack` (`req`, and `strokes`, `removed`, `upto` or `error`): `board_add` (`strokes`, 1-20, checked
        as poll strokes; up to 20,000 per board), `board_erase` (`ids`, or `gesture` to undo one's own line; others' marks only for the host), and for the
        host `board_clear`. The host's `board_access` (`open`, `mode`) reaches everyone as `board_access` with their own `can_draw`; others get `board` events
        (`op`: add, remove, clear with `upto`).
      parameters: [{ $ref: '#/components/parameters/code' }]
      responses: { '101': { description: 'Switching protocols' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '410': { $ref: '#/components/responses/Gone' } }
  /beacon/attempts/{id}/violations:
    post:
      operationId: postBeaconAttemptsViolations
      tags: [realtime]
      summary: navigator.sendBeacon fallback for violation reports
      description: 'Same as `POST /api/attempts/{id}/violations`, but checks `Origin` only (beacons cannot set headers). Send JSON as `text/plain`.'
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { text/plain: { schema: { $ref: '#/components/schemas/ViolationInput' } } } }
      responses: { '204': { description: 'Recorded' }, '403': { $ref: '#/components/responses/Forbidden' } }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: HttpOnly session cookie set by `POST /api/auth/login` or `/register`.

  parameters:
    id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    attempt: { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
    question: { name: question, in: path, required: true, schema: { type: string, format: uuid } }
    code: { name: code, in: path, required: true, description: 'Join code', schema: { type: string, example: K7Q2XM } }
    page: { name: page, in: query, description: 'Page number, from 1 (PL-FR-01)', schema: { type: integer, minimum: 1, default: 1 } }
    size: { name: size, in: query, description: 'Rows per page', schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    q: { name: q, in: query, description: 'Search text; matches across all pages', schema: { type: string, maxLength: 200 } }
    dir: { name: dir, in: query, description: 'Sort direction; each sort has its own default', schema: { type: string, enum: [asc, desc] } }
    pollToken: { name: X-Poll-Token, in: header, required: false, description: 'Anonymous participant token from join', schema: { type: string } }

  requestBodies:
    CSV:
      required: true
      content:
        text/csv: { schema: { type: string } }
        multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } }
    Target:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/Target' } } }

  responses:
    Error: { description: 'Error', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Invalid: { description: 'Validation failed (`validation_failed`, see `fields`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: 'Login required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'Not allowed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 'Not found (also returned for other users'' resources)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 'Conflict', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Gone: { description: 'The session has ended (`session_ended`; BR-04)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: 'Too many attempts', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Busy:
      description: Password hashing queue is full during a login burst; retry after `Retry-After` seconds
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Affected: { description: 'Number of students affected', content: { application/json: { schema: { type: object, properties: { affected: { type: integer } } } } } }
    State: { description: 'Attempt state', content: { application/json: { schema: { $ref: '#/components/schemas/StudentState' } } } }
    Layer:
      description: Overrides at this level and the resolved effective settings
      content: { application/json: { schema: { type: object, properties: { overrides: { $ref: '#/components/schemas/Overrides' }, effective: { $ref: '#/components/schemas/Effective' } } } } }

  schemas:
    MeetingLimits:
      type: object
      properties:
        max_people: { type: integer, minimum: 0, maximum: 1000, description: 'People in one meeting; 0 is unlimited, otherwise at least 2' }
        max_open: { type: integer, minimum: 0, maximum: 1000, description: 'Open meetings per teacher; 0 is unlimited' }
    DriveConfig:
      type: object
      properties:
        enabled: { type: boolean }
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true, description: 'Sealed with the master key; empty keeps the stored one' }
        client_secret_set: { type: boolean, readOnly: true }
        api_key: { type: string, description: "For Google's file picker; restrict it to your site in Google's console" }
        app_id: { type: string, description: 'The Cloud project number' }
        updated_at: { type: string, format: date-time, readOnly: true }
    DriveStatus:
      type: object
      properties:
        available: { type: boolean, description: 'Drive is set up on this platform' }
        connected: { type: boolean }
        email: { type: string }
        reconnect: { type: boolean, description: 'Google no longer accepts the token' }
        auto_backup: { type: boolean }
        folder_link: { type: string, description: 'The results folder' }
        connected_at: { type: string, format: date-time }
    DriveExport:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [session, poll] }
        target_id: { type: string, format: uuid }
        name: { type: string }
        web_link: { type: string }
        automatic: { type: boolean }
        status: { type: string, enum: [done, failed] }
        error: { type: string }
        created_at: { type: string, format: date-time }
    ClassroomDriveFile:
      type: object
      properties:
        id: { type: string, format: uuid }
        file_id: { type: string, description: 'Teachers only' }
        name: { type: string }
        mime_type: { type: string }
        web_link: { type: string }
        icon_link: { type: string }
        sharing: { type: string, enum: [students, link, none], description: 'Teachers only' }
        shared_with: { type: integer, description: 'Students it is shared with (teachers only)' }
        synced_at: { type: string, format: date-time }
        sync_error: { type: string, description: 'Why some sharing failed (teachers only)' }
        created_at: { type: string, format: date-time }
    SSOOption:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string, example: Google } }
    Identity:
      type: object
      properties:
        provider_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, description: 'As the provider last gave it' }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    SSOProvider:
      type: object
      required: [name, issuer, client_id]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 60, description: 'On the button: "Sign in with NAME"' }
        enabled: { type: boolean }
        issuer: { type: string, format: uri, example: 'https://accounts.google.com', description: 'https, or http on localhost' }
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true, description: 'Sealed with the master key; empty keeps the stored one' }
        client_secret_set: { type: boolean, readOnly: true }
        clear_secret: { type: boolean, writeOnly: true }
        scopes: { type: array, items: { type: string }, default: [openid, email, profile] }
        email_claim: { type: string, default: email, description: 'Entra ID: preferred_username' }
        trust_email: { type: boolean, description: 'Treat emails as verified when the provider sends no email_verified' }
        allowed_domains: { type: array, items: { type: string }, description: 'Empty: any' }
        new_accounts: { type: string, enum: [none, student, teacher], description: 'The role of accounts made on first sign-in' }
        teacher_claim: { type: string, description: 'With new_accounts student: new accounts whose claim has one of teacher_values become teachers' }
        teacher_values: { type: array, items: { type: string } }
        link_by_email: { type: boolean, description: 'A first sign-in may join the student or teacher account with the same verified email' }
        updated_at: { type: string, format: date-time, readOnly: true }
    Meeting:
      type: object
      properties:
        id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        host_name: { type: string }
        title: { type: string }
        code: { type: string, example: K7Q2XM3P }
        classroom_id: { type: string, format: uuid, nullable: true }
        max_people: { type: integer }
        status: { type: string, enum: [open, ended] }
        created_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        online: { type: integer, description: 'People in the meeting now' }
    MeetingAccess:
      type: object
      properties:
        meeting: { $ref: '#/components/schemas/Meeting' }
        host: { type: boolean }
        ice_servers: { type: array, description: 'For RTCPeerConnection; TURN credentials expire after 6 hours', items: { type: object, properties: { urls: { type: array, items: { type: string } }, username: { type: string }, credential: { type: string } } } }
    MeetingAttendance:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        first_joined: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        joins: { type: integer }
        online: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation_failed }
        message: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    DirectoryConfig:
      type: object
      properties:
        enabled: { type: boolean }
        kind: { type: string, enum: [ad, ldap], description: '`ad`: Windows Active Directory; `ldap`: OpenLDAP and others' }
        url: { type: string, example: 'ldaps://dc1.school.local' }
        start_tls: { type: boolean }
        ca_pem: { type: string, description: 'Extra CA certificate (PEM) to trust' }
        bind_dn: { type: string, description: 'The service account that searches' }
        bind_password: { type: string, format: password, writeOnly: true }
        bind_password_set: { type: boolean, readOnly: true }
        base_dn: { type: string }
        user_filter: { type: string, description: '`{login}` is replaced by the escaped sign-in name' }
        id_attr: { type: string }
        email_attr: { type: string }
        name_attr: { type: string }
        teacher_group: { type: string, description: 'DN; members sign in as teachers' }
        student_group: { type: string, description: 'DN; empty = everyone else found signs in as a student' }
        nested_groups: { type: boolean }
        link_by_email: { type: boolean }
        updated_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [student, teacher, manager, admin], description: '`manager` is a manager-only account; a teacher-manager is `teacher` with `manager` set' }
        status: { type: string, enum: [active, pending_approval, suspended, deleted] }
        email_verified: { type: boolean }
        avatar: { type: string, description: 'Profile picture version; absent when there is none (D-49)' }
        directory: { type: boolean, description: 'Signs in with the school directory, not a password of its own (D-64)' }
        created_at: { type: string, format: date-time, description: 'Only in admin lists' }
        manager:
          type: object
          description: Present for managers (PL-FR-10). In a manager's user list, `features` is empty.
          properties: { features: { type: array, items: { $ref: '#/components/schemas/Feature' } } }
    Feature:
      type: string
      description: An admin feature a manager can be given (PL-FR-10)
      enum: [view_users, manage_users, approval_policy, settings, usage, audit, storage, cleanup, backups]
    StorageLimits:
      type: object
      properties:
        recording_limit_bytes: { type: integer, format: int64 }
        backup_space_bytes: { type: integer, format: int64 }
    StorageOverview:
      type: object
      properties:
        taken_at: { type: string, format: date-time }
        db_bytes: { type: integer, format: int64 }
        areas: { type: object, additionalProperties: { type: integer, format: int64 }, description: 'Bytes by area: accounts, classrooms, quizzes_sessions, answers, polls, poll_uploads, whiteboards, results, audit, ai_marking, profile_pictures, jobs, system, other' }
        backups_bytes: { type: integer, format: int64 }
        recordings_bytes: { type: integer, format: int64 }
        disk_free: { type: integer, format: int64 }
        disk_total: { type: integer, format: int64 }
        limits: { $ref: '#/components/schemas/StorageLimits' }
        fixed_limits: { type: array, items: { type: object, properties: { label: { type: string }, value: { type: string } } } }
        growth: { type: array, items: { type: object, properties: { day: { type: string, format: date }, db_bytes: { type: integer }, backups_bytes: { type: integer } } } }
        nightly: { $ref: '#/components/schemas/NightlyStatus' }
        running: { $ref: '#/components/schemas/Backup' }
    NightlyStatus:
      type: object
      description: What deploy/backup.sh last reported (QP_NIGHTLY_BACKUP_DIR)
      properties:
        configured: { type: boolean }
        last_run_at: { type: string, format: date-time }
        last_run_ok: { type: boolean }
        last_success_at: { type: string, format: date-time }
        stale: { type: boolean, description: 'No success for 2 days' }
    CleanupInput:
      type: object
      required: [area, before]
      properties:
        area: { type: string, example: poll_files }
        before: { type: string, format: date, description: 'Data from before this day (UTC)' }
    Freed: { type: object, properties: { items: { type: integer }, bytes: { type: integer, format: int64 } } }
    Backup:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [console, nightly] }
        name: { type: string }
        status: { type: string, enum: [running, done, failed] }
        created_by: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }
        tables_done: { type: integer }
        tables_total: { type: integer }
        rows_done: { type: integer }
        error: { type: string }
        on_server: { type: boolean }
        deleted_at: { type: string, format: date-time }
    MakeManagerInput:
      type: object
      properties:
        user_id: { type: string, format: uuid, description: 'An active teacher, who keeps teaching' }
        email: { type: string, format: email, description: 'For a new manager-only account' }
        name: { type: string, maxLength: 100 }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
    ManagerRow:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          properties:
            granted_at: { type: string, format: date-time }
            granted_by: { type: string, description: 'Name of the admin who made them a manager' }
            last_active_at: { type: string, format: date-time }
    RegisterInput:
      type: object
      required: [email, name, password, role]
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { type: string, enum: [student, teacher] }
    LoginInput:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string } }
    TokenInput: { type: object, required: [token], properties: { token: { type: string } } }
    AuthPolicy: { type: object, properties: { require_teacher_approval: { type: boolean } } }
    Usage:
      type: object
      properties:
        users_by_role: { type: object, additionalProperties: { type: integer } }
        users_by_status: { type: object, additionalProperties: { type: integer } }
        classrooms: { type: integer }
        quizzes: { type: integer }
        sessions: { type: integer }
        sessions_30d: { type: integer }
        live_sessions: { type: integer }
        attempts_30d: { type: integer }
        violations_30d: { type: integer }
        teachers_with_llm_keys: { type: integer }
        jobs_by_queue_state: { type: object, additionalProperties: { type: integer } }
    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        actor_id: { type: [string, 'null'] }
        actor_name: { type: string }
        actor_role: { type: string, enum: [admin, manager], description: 'The role the actor acted in (PL-FR-15); absent outside the admin console' }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        details: { type: object }
        created_at: { type: string, format: date-time }

    Overrides:
      description: |
        Sparse settings for one level (BA §7). Omitted keys inherit from the level above; each key
        may be set only at the levels listed (the platform level may set any key). 0 means "no limit".
      type: object
      additionalProperties: false
      properties:
        countdown_seconds: { type: integer, minimum: 0, maximum: 3600, description: 'teacher, classroom, quiz, session' }
        question_time_limit_sec: { type: integer, minimum: 0, description: 'quiz, question' }
        quiz_time_limit_sec: { type: integer, minimum: 0, description: 'topic, quiz, session, student' }
        admission_mode: { type: string, enum: [manual, auto], description: 'classroom, session' }
        start_mode: { type: string, enum: [countdown, teacher], description: 'teacher, classroom, quiz, session. countdown: each student counts down from admission; teacher: admitted students wait for the teacher''s Start (D-53)' }
        evaluation_method: { type: string, enum: [key, llm, manual], description: 'teacher, quiz, question' }
        llm_key_id: { type: string, description: 'teacher, quiz, question' }
        llm_model: { type: string, description: 'teacher, quiz, question' }
        feedback_mode: { type: string, enum: [none, predefined, ai, both], description: 'teacher, quiz, question' }
        violation_policy: { type: string, enum: [invalidate, warn_then_invalidate, log_only], description: 'classroom, quiz, session' }
        allowed_warnings: { type: integer, minimum: 0, description: 'classroom, quiz, session' }
        blur_grace_ms: { type: integer, minimum: 0, description: 'classroom, quiz, session' }
        disconnect_grace_sec: { type: integer, minimum: 0, description: 'classroom, quiz, session' }
        question_order: { type: string, enum: [fixed, shuffled], description: 'quiz, session' }
        question_draw: { type: integer, minimum: 0, maximum: 1000, description: 'quiz, session: questions each student gets, drawn at random (0 = all; D-65)' }
        option_order: { type: string, enum: [fixed, shuffled], description: 'quiz, question' }
        one_way_navigation: { type: boolean, description: 'quiz' }
        results_visibility: { type: string, enum: [private, public], description: 'quiz, session' }
        results_view: { type: string, enum: [individual, question_pct, pass_rate], description: 'quiz, session' }
        results_release: { type: string, enum: [immediate, on_session_end, manual], description: 'quiz, session' }
        results_show_answers: { type: boolean, description: 'quiz, session' }
        results_show_correct: { type: boolean, description: 'quiz, session' }
        results_show_feedback: { type: boolean, description: 'quiz, session' }
        pass_mark_pct: { type: integer, minimum: 0, maximum: 100, description: 'classroom, quiz' }
        student_id_required: { type: boolean, description: 'classroom' }
        enrolment_approval: { type: boolean, description: 'classroom' }
        auto_enrol_on_join: { type: boolean, description: 'classroom' }
        team_mode: { type: string, enum: ['off', manual, random, categories, self], description: 'quiz, session (D-44)' }
        team_acceptance: { type: string, enum: [all, first, captain, best], description: 'quiz, session' }
        team_calc: { type: string, enum: [sum, average, max, min], description: 'quiz, session; team_acceptance=all' }
    Effective:
      description: Fully resolved settings; every key from `Overrides` has a value.
      type: object
      additionalProperties: true

    Classroom:
      type: object
      properties:
        id: { type: string, format: uuid }
        teacher_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        join_code: { type: string, example: K7Q2XMAB }
        settings: { $ref: '#/components/schemas/Overrides' }
        effective: { $ref: '#/components/schemas/Effective' }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
    ClassroomInput:
      type: object
      properties: { name: { type: string, maxLength: 200 }, description: { type: string }, settings: { $ref: '#/components/schemas/Overrides' } }
    NodeInput:
      type: object
      properties: { name: { type: string, maxLength: 200 }, position: { type: integer }, settings: { $ref: '#/components/schemas/Overrides' } }
    Module:
      type: object
      properties: { id: { type: string, format: uuid }, classroom_id: { type: string, format: uuid }, name: { type: string }, position: { type: integer }, settings: { $ref: '#/components/schemas/Overrides' } }
    Topic:
      type: object
      properties: { id: { type: string, format: uuid }, module_id: { type: string, format: uuid }, name: { type: string }, position: { type: integer }, settings: { $ref: '#/components/schemas/Overrides' } }
    TopicDetail:
      allOf:
        - $ref: '#/components/schemas/Topic'
        - type: object
          properties: { classroom_id: { type: string, format: uuid }, classroom_name: { type: string }, module_name: { type: string } }
    Enrolment:
      type: object
      properties:
        id: { type: string, format: uuid }
        classroom_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        student_number: { type: [string, 'null'], description: 'Classroom-specific student ID (BR-03)' }
        status: { type: string, enum: [pending, active, rejected, removed] }
        created_at: { type: string, format: date-time }
        student_name: { type: string }
        student_email: { type: string }
        student_avatar: { type: string, description: Profile picture version }
        categories: { type: array, items: { type: string, format: uuid }, description: 'Category ids (teacher view)' }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        classroom_id: { type: string, format: uuid }
        name: { type: string }
        color: { type: integer, minimum: 1, maximum: 8, description: 'Slot of the categorical palette' }
        position: { type: integer }
        members: { type: integer, description: 'Active students in the category' }
    CategoryInput:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        color: { type: integer, minimum: 1, maximum: 8 }
    ClassroomPreview:
      type: object
      properties:
        classroom_id: { type: string, format: uuid }
        name: { type: string }
        student_id_required: { type: boolean }
        enrolment: { oneOf: [{ $ref: '#/components/schemas/Enrolment' }, { type: 'null' }] }

    PoolRule:
      type: object
      properties:
        source: { type: string, enum: [quiz, bank] }
        category: { type: string, description: 'Empty = questions without a category' }
        count: { type: integer, minimum: 0, maximum: 1000, description: '0 = all of them' }
    PoolInfo:
      type: object
      properties:
        pools: { type: array, items: { $ref: '#/components/schemas/PoolRule' } }
        quiz: { type: array, items: { $ref: '#/components/schemas/PoolCount' } }
        bank: { type: array, items: { $ref: '#/components/schemas/PoolCount' } }
        bank_id: { type: string, format: uuid }
    PoolCount:
      type: object
      properties: { category: { type: string }, count: { type: integer }, marks: { type: number } }
    Quiz:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [quiz, bank], description: '`bank`: a teacher''s question bank (D-66)' }
        pools: { type: array, items: { $ref: '#/components/schemas/PoolRule' } }
        topic_id: { type: string, description: 'Empty for a question bank' }
        teacher_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, ready, archived] }
        warnings_accepted: { type: boolean }
        settings: { $ref: '#/components/schemas/Overrides' }
        effective: { $ref: '#/components/schemas/Effective' }
        question_count: { type: integer }
        total_marks: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuizInput:
      type: object
      properties: { title: { type: string, maxLength: 200 }, description: { type: string }, settings: { $ref: '#/components/schemas/Overrides' } }
    QuestionType:
      type: string
      enum: [SINGLE, MULTI, MATCH, BLANK_OPT, BLANK_TEXT, DRAG, ESSAY]
      description: BA §10.1 question types.
    Choice: { type: object, properties: { id: { type: string, example: o1 }, text: { type: string } } }
    Body:
      description: Student-visible structure. Choice ids are assigned (o1, l1, r1, z1…) when missing.
      type: object
      properties:
        options: { type: array, items: { $ref: '#/components/schemas/Choice' }, description: 'SINGLE, MULTI, BLANK_OPT (shared pool), DRAG items' }
        left: { type: array, items: { $ref: '#/components/schemas/Choice' }, description: 'MATCH' }
        right: { type: array, items: { $ref: '#/components/schemas/Choice' }, description: 'MATCH' }
        zones: { type: array, items: { $ref: '#/components/schemas/Choice' }, description: 'DRAG into boxes; empty means DRAG ordering' }
        blanks: { type: array, items: { type: string }, readOnly: true, description: 'Derived from [[n]] markers in the text' }
        word_limit: { type: integer, description: 'ESSAY' }
        format: { type: string, enum: ['', markdown], description: 'Text format of the question text and predefined feedback. Empty means plain text (CSV import); markdown is written by the rich text editor (bold, italic, underline as ++text++, lists, tables, code, links, $math$).' }
    Key:
      description: Answer key. Never sent to students before results are released (BR-12).
      type: object
      properties:
        correct: { type: array, items: { type: string }, description: 'SINGLE/MULTI option ids' }
        pairs: { type: object, additionalProperties: { type: string }, description: 'MATCH left→right; DRAG item→zone' }
        blanks: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 'BLANK_OPT: blank→[option id]; BLANK_TEXT: blank→accepted answers' }
        order: { type: array, items: { type: string }, description: 'DRAG ordering' }
        case_sensitive: { type: boolean }
        tolerance: { type: integer, minimum: 0, maximum: 3, description: 'BLANK_TEXT spelling tolerance (edits)' }
        model_answer: { type: string }
        rubric: { type: string }
    Feedback:
      type: object
      properties:
        correct: { type: string }
        incorrect: { type: string }
        options: { type: object, additionalProperties: { type: string }, description: 'Per option id or blank id' }
        bands: { type: array, items: { type: object, properties: { min_pct: { type: integer }, max_pct: { type: integer }, text: { type: string } } } }
    Resource:
      type: object
      properties:
        id: { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        role: { type: string, enum: [Q, O, F], description: 'Question stem, option n, or feedback' }
        n: { type: integer }
        source_url: { type: string }
        url: { type: string, description: 'Normalised embeddable URL (Drive links → thumbnail form)' }
        alt_text: { type: string }
        status: { type: string, enum: [unchecked, ok, broken] }
        message: { type: string }
        checked_at: { type: [string, 'null'], format: date-time }
    ResourceInput:
      type: object
      required: [role, n, url]
      properties: { role: { type: string, enum: [Q, O, F] }, n: { type: integer, minimum: 1, maximum: 50 }, url: { type: string }, alt_text: { type: string } }
    QuestionInput:
      type: object
      required: [code, type, text]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$' }
        type: { $ref: '#/components/schemas/QuestionType' }
        text: { type: string, maxLength: 5000 }
        body: { $ref: '#/components/schemas/Body' }
        key: { $ref: '#/components/schemas/Key' }
        feedback: { $ref: '#/components/schemas/Feedback' }
        marks: { type: number, default: 1 }
        negative_marks: { type: number, default: 0 }
        partial_credit: { type: boolean, description: 'Defaults by type (BA §10.1)' }
        settings:
          type: object
          description: Question-level overrides
          properties:
            question_time_limit_sec: { type: integer }
            evaluation_method: { type: string, enum: [key, llm, manual] }
            llm_key_id: { type: string }
            llm_model: { type: string }
            feedback_mode: { type: string, enum: [none, predefined, ai, both] }
            option_order: { type: string, enum: [fixed, shuffled] }
      example:
        code: Q001
        type: SINGLE
        text: What is the capital of France?
        body: { options: [{ text: Paris }, { text: Rome }, { text: Madrid }] }
        key: { correct: [o1] }
        marks: 1
        settings: { question_time_limit_sec: 30 }
    Question:
      type: object
      properties:
        id: { type: string, format: uuid }
        quiz_id: { type: string, format: uuid }
        code: { type: string }
        category: { type: string, maxLength: 60, description: 'Puts the question in a pool (D-66); empty = none' }
        from_bank: { type: boolean, description: 'In a session snapshot: drawn from the question bank' }
        position: { type: integer }
        type: { $ref: '#/components/schemas/QuestionType' }
        text: { type: string }
        body: { $ref: '#/components/schemas/Body' }
        key: { $ref: '#/components/schemas/Key' }
        feedback: { $ref: '#/components/schemas/Feedback' }
        marks: { type: number }
        negative_marks: { type: number }
        partial_credit: { type: boolean }
        settings: { $ref: '#/components/schemas/Overrides' }
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
    StudentQuestion:
      description: A question as students see it, without key, feedback or rubric.
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        text: { type: string }
        body: { $ref: '#/components/schemas/Body' }
        marks: { type: number }
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
    Response:
      description: |
        A student's answer. SINGLE/MULTI → `selected`; MATCH → `pairs` (left→right);
        BLANK_OPT → `blanks` (blank→option id); BLANK_TEXT → `blanks` (blank→text);
        DRAG ordering → `order`; DRAG boxes → `pairs` (item→zone); ESSAY → `text`.
      type: object
      properties:
        selected: { type: array, items: { type: string } }
        pairs: { type: object, additionalProperties: { type: string } }
        blanks: { type: object, additionalProperties: { type: string } }
        order: { type: array, items: { type: string } }
        text: { type: string }
    ImportReport:
      type: object
      properties:
        imported: { type: integer }
        rejected:
          type: array
          items:
            type: object
            properties: { row: { type: integer, description: 'Line number (header is 1)' }, code: { type: string }, errors: { type: object, additionalProperties: { type: string } } }

    Target:
      type: object
      description: Choose students by attempt id, or all.
      properties: { all: { type: boolean }, attempt_ids: { type: array, items: { type: string, format: uuid } } }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        quiz_id: { type: string, format: uuid }
        teacher_id: { type: string, format: uuid }
        classroom_id: { type: string, format: uuid }
        title: { type: string }
        join_code: { type: string, example: K7Q2XM }
        join_url: { type: string, description: 'Encode this in the QR code' }
        status: { type: string, enum: [open, live, ended] }
        settings: { $ref: '#/components/schemas/Overrides' }
        extension_sec: { type: integer, description: 'Session-wide extension' }
        created_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        results_released_at: { type: [string, 'null'], format: date-time }
    AttemptState: { type: string, enum: [waiting, admitted, in_progress, paused, submitted, invalidated, not_started] }
    Attempt:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        student_number: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/AttemptState' }
        extension_sec: { type: integer }
        warnings: { type: integer }
        violations: { type: integer }
        invalid_reason: { type: string }
    StudentState:
      description: Full attempt state. Deadlines are server epoch milliseconds; render `deadline - (Date.now() + offset)` with the offset from `server_time` (ADR-07).
      type: object
      properties:
        type: { type: string, const: state }
        server_time: { type: integer, format: int64 }
        attempt_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        session_title: { type: string }
        quiz_title: { type: string }
        session_status: { type: string, enum: [open, live, ended] }
        state: { $ref: '#/components/schemas/AttemptState' }
        student_number: { type: [string, 'null'] }
        countdown_deadline: { type: [integer, 'null'], format: int64 }
        quiz_deadline: { type: [integer, 'null'], format: int64 }
        question_deadline: { type: [integer, 'null'], format: int64, description: 'Capped by the quiz deadline' }
        quiz_remaining_ms: { type: [integer, 'null'], description: 'Set while paused' }
        question_remaining_ms: { type: [integer, 'null'] }
        index: { type: integer }
        total: { type: integer }
        answered: { type: [array, 'null'], items: { type: boolean } }
        flagged: { type: array, items: { type: boolean }, description: 'Questions the student flagged to come back to, by position (D-61); only with free navigation' }
        one_way: { type: boolean }
        question: { oneOf: [{ $ref: '#/components/schemas/StudentQuestion' }, { type: 'null' }], description: 'Only while in progress' }
        answer: { oneOf: [{ $ref: '#/components/schemas/Response' }, { type: 'null' }], description: 'Saved answer for the current question' }
        violation_policy: { type: string }
        warnings: { type: integer }
        allowed_warnings: { type: integer }
        blur_grace_ms: { type: integer }
        invalid_reason: { type: string }
        team: { $ref: '#/components/schemas/TeamInfo' }
        captain: { type: boolean }
    TeamInput:
      type: object
      properties:
        name: { type: string, maxLength: 40 }
        color: { type: integer, minimum: 1, maximum: 8 }
    TeamInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: integer, description: Categorical palette slot }
        position: { type: integer }
        category_id: { type: string, format: uuid }
        members: { type: integer }
    TeamsView:
      type: object
      properties:
        mode: { type: string }
        acceptance: { type: string }
        calc: { type: string }
        teams:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/TeamInfo'
              - type: object
                properties: { member_list: { type: array, items: { $ref: '#/components/schemas/TeamMember' } } }
        unassigned: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
    TeamMember:
      type: object
      properties:
        attempt_id: { type: string, format: uuid }
        name: { type: string }
        student_number: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/AttemptState' }
        captain: { type: boolean }
        team_id: { type: string }
    TeamStanding:
      type: object
      properties:
        rank: { type: integer }
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: integer }
        members: { type: integer, description: Not counting invalidated attempts }
        finished: { type: integer, description: Members whose attempt is marked }
        score: { type: number }
        max_score: { type: number }
        pct: { type: number }
        complete: { type: boolean, description: False while a counted mark is pending }
    JoinPreview:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        title: { type: string }
        quiz_title: { type: string }
        status: { type: string }
        student_id_required: { type: boolean }
        attempt: { oneOf: [{ $ref: '#/components/schemas/Attempt' }, { type: 'null' }] }
        team_mode: { type: string }
        teams: { type: array, items: { $ref: '#/components/schemas/TeamInfo' } }
    ViolationInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [tab_hidden, window_blur, page_close, fullscreen_exit] }
        client_ts: { type: integer, format: int64, description: 'Client clock, evidence only' }
    Dashboard:
      type: object
      properties:
        type: { type: string, const: dashboard }
        server_time: { type: integer, format: int64 }
        session: { $ref: '#/components/schemas/Session' }
        counts: { type: object, additionalProperties: { type: integer }, description: 'Attempts per state' }
        rows:
          type: array
          items:
            type: object
            properties:
              attempt_id: { type: string, format: uuid }
              user_id: { type: string, format: uuid }
              name: { type: string }
              avatar: { type: string, description: Profile picture version }
              student_number: { type: [string, 'null'] }
              state: { $ref: '#/components/schemas/AttemptState' }
              index: { type: integer }
              total: { type: integer }
              answered: { type: integer }
              warnings: { type: integer }
              violations: { type: integer }
              extension_sec: { type: integer }
              quiz_deadline: { type: [integer, 'null'], format: int64 }
              remaining_ms: { type: [integer, 'null'] }
              connected: { type: boolean }
              invalid_reason: { type: string }
              team_id: { type: string }
              captain: { type: boolean }
        teams: { type: array, items: { $ref: '#/components/schemas/TeamInfo' } }
    SessionEvent:
      type: object
      properties:
        id: { type: integer }
        attempt_id: { type: [string, 'null'] }
        actor_id: { type: [string, 'null'] }
        kind: { type: string, example: violation }
        details: { type: object }
        created_at: { type: string, format: date-time }

    MarkView:
      type: object
      properties:
        question_id: { type: string, format: uuid }
        code: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        text: { type: string }
        format: { type: string, enum: ['', markdown], description: 'Text format of the question text and feedback (Body.format)' }
        response: { oneOf: [{ $ref: '#/components/schemas/Response' }, { type: 'null' }] }
        key: { $ref: '#/components/schemas/Key' }
        method: { type: string, enum: [key, llm, manual] }
        status: { type: string, enum: [marked, pending, needs_manual, overridden] }
        score: { type: [number, 'null'] }
        max_score: { type: number }
        correct: { type: [boolean, 'null'] }
        feedback: { type: string }
        ai_feedback: { type: string }
        ai_rationale: { type: string }
        ai_marked: { type: boolean }
        flagged: { type: boolean }
        flag_reason: { type: string }
    AttemptResult:
      type: object
      properties:
        attempt_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        student_number: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/AttemptState' }
        score: { type: number }
        max_score: { type: number }
        pct: { type: number }
        pass_mark_pct: { type: integer }
        passed: { type: boolean }
        complete: { type: boolean, description: 'False while LLM or manual marks are outstanding' }
        invalidated: { type: boolean }
        marks: { type: array, items: { $ref: '#/components/schemas/MarkView' } }
    StudentAttempt:
      type: object
      properties:
        attempt_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        session_title: { type: string }
        quiz_title: { type: string }
        state: { $ref: '#/components/schemas/AttemptState' }
        released: { type: boolean }
        submitted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    StudentResult:
      type: object
      properties:
        attempt_id: { type: string, format: uuid }
        session_title: { type: string }
        quiz_title: { type: string }
        state: { $ref: '#/components/schemas/AttemptState' }
        student_number: { type: [string, 'null'] }
        score: { type: number }
        max_score: { type: number }
        pct: { type: number }
        pass_mark_pct: { type: integer }
        passed: { type: boolean }
        complete: { type: boolean }
        team:
          description: The student's team and its place (D-44)
          allOf:
            - $ref: '#/components/schemas/TeamStanding'
            - type: object
              properties: { of: { type: integer, description: Number of teams } }
        questions:
          type: array
          items:
            type: object
            properties:
              question: { $ref: '#/components/schemas/StudentQuestion' }
              response: { $ref: '#/components/schemas/Response' }
              correct_answer: { $ref: '#/components/schemas/Key' }
              score: { type: [number, 'null'] }
              max_score: { type: number }
              status: { type: string }
              correct: { type: [boolean, 'null'] }
              feedback: { type: string }
              ai_feedback: { type: string }
              ai_marked: { type: boolean }
              feedback_resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }

    LLMKey:
      type: object
      description: Masked view; the key itself is never returned (BR-10, AC-11).
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [anthropic, openai, google] }
        label: { type: string }
        model: { type: string }
        last4: { type: string }
        is_default: { type: boolean }
        last_test_at: { type: [string, 'null'], format: date-time }
        last_test_ok: { type: [boolean, 'null'] }
        last_test_error: { type: string }
        created_at: { type: string, format: date-time }
    LLMKeyInput:
      type: object
      required: [provider, api_key]
      properties:
        provider: { type: string, enum: [anthropic, openai, google] }
        model: { type: string, description: 'Required for openai and google; anthropic defaults to claude-opus-5-5' }
        label: { type: string }
        api_key: { type: string, writeOnly: true }
        is_default: { type: boolean }

    ClassStats:
      type: object
      properties:
        joined: { type: integer }
        finished: { type: integer }
        marked: { type: integer }
        mean_pct: { type: number }
        median_pct: { type: number }
        pass_rate: { type: number }
        pass_mark_pct: { type: integer }
        completion_rate: { type: number }
        invalidation_rate: { type: number }
        distribution: { type: array, items: { type: integer }, minItems: 10, maxItems: 10, description: 'Counts per 10-point band' }
        pending: { type: integer }
    QuestionStats:
      type: object
      properties:
        question_id: { type: string, format: uuid }
        code: { type: string }
        text: { type: string }
        format: { type: string, enum: ['', markdown], description: 'Text format of the question text and feedback (Body.format)' }
        type: { $ref: '#/components/schemas/QuestionType' }
        max_score: { type: number }
        answered: { type: integer }
        shown: { type: integer, description: 'Students who got the question; fewer than all when they drew a subset (question_draw, D-65)' }
        pct_correct: { type: number }
        avg_score: { type: number }
        option_counts: { type: object, additionalProperties: { type: integer } }
        option_labels: { type: object, additionalProperties: { type: string } }
        common_wrong: { type: array, items: { type: object, properties: { answer: { type: string }, count: { type: integer } } } }
        discrimination: { type: [number, 'null'], description: 'Upper 27% minus lower 27% correct rate' }
    StudentStats:
      type: object
      properties:
        attempt_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        name: { type: string }
        student_number: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/AttemptState' }
        score: { type: number }
        max_score: { type: number }
        pct: { type: number }
        passed: { type: boolean }
        complete: { type: boolean }
        time_taken_sec: { type: [integer, 'null'] }
        violations: { type: integer }
        extension_sec: { type: integer }
        pauses: { type: integer }
        answers: { type: array, items: { type: object, properties: { question_id: { type: string }, code: { type: string }, response: { $ref: '#/components/schemas/Response' }, score: { type: [number, 'null'] }, correct: { type: [boolean, 'null'] } } } }
    SessionStats:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        title: { type: string }
        quiz_title: { type: string }
        created_at: { type: string, format: date-time }
        class: { $ref: '#/components/schemas/ClassStats' }
        questions: { type: array, items: { $ref: '#/components/schemas/QuestionStats' } }
        students: { type: array, items: { $ref: '#/components/schemas/StudentStats' } }
        computed_at: { type: string, format: date-time }
    QuizStats:
      type: object
      properties:
        quiz_id: { type: string, format: uuid }
        quiz_title: { type: string }
        class: { $ref: '#/components/schemas/ClassStats' }
        questions: { type: array, items: { $ref: '#/components/schemas/QuestionStats' } }
        students: { type: array, items: { $ref: '#/components/schemas/StudentStats' } }
        comparison:
          type: array
          items: { type: object, properties: { session_id: { type: string }, title: { type: string }, created_at: { type: string, format: date-time }, class: { $ref: '#/components/schemas/ClassStats' } } }
    ShareInput:
      type: object
      required: [scope, target_id]
      properties:
        scope: { type: string, enum: [session, quiz, live_session, live_poll], description: 'live_*: a live leaderboard page (target is a session or a poll)' }
        target_id: { type: string, format: uuid }
        views: { type: array, items: { type: string, enum: [individual, question_pct, pass_rate, leaderboard, teams] }, description: 'Defaults to the session''s results_view; live links use leaderboard and teams (both by default)' }
        identify: { type: string, enum: [anonymous, student_id, nickname], default: anonymous, description: 'student_id for sessions; nickname (the default) for polls' }
        show_answers: { type: boolean, default: false }
        label: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
    LiveView:
      type: object
      properties:
        type: { type: string, const: live }
        kind: { type: string, enum: [poll, session] }
        title: { type: string }
        subtitle: { type: string }
        status: { type: string }
        unit: { type: string, enum: [points, percent] }
        views: { type: array, items: { type: string } }
        people: { type: array, items: { type: object, properties: { rank: { type: integer }, label: { type: string }, score: { type: number }, detail: { type: string }, team: { type: string }, color: { type: integer } } } }
        teams: { type: array, items: { type: object, properties: { rank: { type: integer }, name: { type: string }, color: { type: integer }, score: { type: number }, detail: { type: string } } } }
        joined: { type: integer }
        finished: { type: integer, description: Sessions only }
        scoring: { type: boolean }
        refresh_ms: { type: integer }
        updated_at: { type: integer, format: int64 }
    ShareLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: 'Only in create/regenerate responses; the public URL is /r/{token}' }
        scope: { type: string, enum: [session, quiz] }
        target_id: { type: string, format: uuid }
        views: { type: array, items: { type: string } }
        identify: { type: string }
        show_answers: { type: boolean }
        label: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    PublicView:
      type: object
      properties:
        title: { type: string }
        quiz_title: { type: string }
        views: { type: array, items: { type: string } }
        pass_rate: { type: object, properties: { pass_rate: { type: number }, pass_mark_pct: { type: integer }, finished: { type: integer }, mean_pct: { type: number } } }
        questions: { type: array, items: { type: object, properties: { code: { type: string }, text: { type: string }, format: { type: string, enum: ['', markdown] }, pct_correct: { type: number }, answered: { type: integer } } } }
        students:
          type: array
          items:
            type: object
            properties:
              label: { type: string, description: '"Student N" or the classroom student ID — never a name or email' }
              score: { type: number }
              max_score: { type: number }
              pct: { type: number }
              passed: { type: boolean }
              answers: { type: array, items: { type: object } }
    PollSettings:
      type: object
      properties:
        identity: { type: string, enum: [anonymous, identified, optional], description: 'anonymous: nobody is identified (no account is stored, even when logged in); identified: login required; optional: each participant chooses' }
        audience: { type: string, enum: [anyone, classroom], description: 'classroom requires identified and classroom_id' }
        pacing: { type: string, enum: [self, presenter] }
        show_results: { type: string, enum: [live, after_answer, presenter, never], description: 'What participants see. after_answer is applied by each browser; never is enforced by the server.' }
        allow_edit: { type: boolean }
        scoring: { type: boolean, description: 'Questions with an answer key award points (D-42)' }
        speed_bonus: { type: boolean, description: 'Timed presenter-led questions: a right answer earns 50-100% of its points depending on speed' }
        leaderboard: { type: string, enum: ['off', presenter, everyone], default: presenter }
        show_answers: { type: string, enum: [never, after_answer, presenter, after_close], description: 'When participants see the correct answer. presenter needs presenter pacing.' }
        names: { type: string, enum: [nickname, name], description: 'Leaderboard names; name (real names) is not allowed in anonymous polls' }
        groups: { type: string, enum: ['off', manual, random, categories, self], description: 'How groups form (D-43). categories needs a classroom and participants who log in.' }
        group_acceptance: { type: string, enum: [all, first, captain, best], description: "Which answers count for the group: every member's, the group's first, the captain's, or the best" }
        group_calc: { type: string, enum: [sum, average, max, min], description: 'acceptance=all: how members'' scores combine. Average and lowest count silent members as 0.' }
    PollInput:
      type: object
      properties:
        title: { type: string }
        classroom_id: { type: [string, 'null'], format: uuid }
        settings: { $ref: '#/components/schemas/PollSettings' }
    Poll:
      allOf:
        - $ref: '#/components/schemas/PollSettings'
        - type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            classroom_id: { type: [string, 'null'], format: uuid }
            join_code: { type: string, example: PK7Q2X }
            join_url: { type: string }
            status: { type: string, enum: [draft, open, closed] }
            current_index: { type: integer }
            revealed: { type: boolean }
            answers_revealed: { type: boolean }
            question_started_at: { type: [string, 'null'], format: date-time }
            participants: { type: integer }
            questions: { type: array, items: { $ref: '#/components/schemas/PollQuestion' } }
    PollQuestionInput:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [SINGLE, MULTI, MATCH, BLANK_OPT, BLANK_TEXT, DRAG, ESSAY, SHORT_TEXT, WORD_CLOUD, NUMBER, DATE, TIME, RATING, SLIDER, LIKERT, MATRIX, FILE, AUDIO, VIDEO, CODE] }
        text: { type: string, description: 'Blanks as [[1]], [[2]] for BLANK_*' }
        required: { type: boolean }
        body: { $ref: '#/components/schemas/PollBody' }
        key: { $ref: '#/components/schemas/PollKey' }
        points: { type: integer, minimum: 0, maximum: 10000, default: 100 }
        time_limit_sec: { type: [integer, 'null'], minimum: 5, maximum: 3600, description: 'Presenter pacing: answers close after this' }
    PollKey:
      type: object
      description: 'Answer key of a scorable question (SINGLE, MULTI, MATCH, BLANK_OPT, BLANK_TEXT, DRAG, SHORT_TEXT, NUMBER, SLIDER, DATE, TIME). Teachers only; participants receive it once revealed.'
      properties:
        correct: { type: array, items: { type: string }, description: 'SINGLE, MULTI: option ids' }
        pairs: { type: object, additionalProperties: { type: string }, description: 'MATCH left id to right id; DRAG item id to box id' }
        blanks: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 'BLANK_OPT option ids or BLANK_TEXT accepted words' }
        order: { type: array, items: { type: string }, description: 'DRAG ranking' }
        accepted: { type: array, items: { type: string }, description: 'SHORT_TEXT answers; DATE or TIME values' }
        value: { type: number, description: 'NUMBER, SLIDER' }
        tolerance: { type: number }
        case_sensitive: { type: boolean }
    PollScore:
      type: object
      properties: { points: { type: number }, correct: { type: boolean } }
    BoardStroke:
      type: object
      required: [gesture, tool, color, size, points]
      properties:
        id: { type: integer, readOnly: true }
        by: { type: string, readOnly: true, description: '"t" for the teacher, otherwise the participant''s opaque key (me_key)' }
        gesture: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$', description: 'Joins the pieces of one gesture, for undo' }
        tool: { type: string, enum: [pen, highlighter, line, rect, ellipse, arrow, text] }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        size: { type: number, minimum: 1, maximum: 80 }
        points: { type: array, items: { type: number }, description: 'x0,y0,x1,y1,… on a 1600×900 board; shapes give two corners, text one position' }
        text: { type: string, maxLength: 200 }
    BoardAccess:
      type: object
      properties:
        open: { type: boolean, description: Participants see the board }
        mode: { type: string, enum: [teacher, everyone, selected], default: teacher }
        groups: { type: array, items: { type: string, format: uuid } }
        participants: { type: array, items: { type: string, format: uuid } }
    BoardView:
      type: object
      properties:
        type: { type: string, const: board_state }
        open: { type: boolean }
        mode: { type: string }
        can_draw: { type: boolean }
        me: { type: string }
        strokes: { type: array, items: { $ref: '#/components/schemas/BoardStroke' } }
        access: { $ref: '#/components/schemas/BoardAccess' }
    PollGroupInput:
      type: object
      properties:
        name: { type: string, maxLength: 40 }
        color: { type: integer, minimum: 1, maximum: 8, description: Categorical palette slot }
    PollGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        poll_id: { type: string, format: uuid }
        name: { type: string }
        color: { type: integer }
        position: { type: integer }
        category_id: { type: string, format: uuid, description: 'Formed from this classroom category' }
        members: { type: array, items: { $ref: '#/components/schemas/PollGroupMember' } }
    PollGroupMember:
      type: object
      properties:
        participant_id: { type: string, format: uuid }
        name: { type: string }
        nickname: { type: string }
        real_name: { type: string }
        captain: { type: boolean }
        group_id: { type: string }
    PollGroupsView:
      type: object
      properties:
        groups: { type: array, items: { $ref: '#/components/schemas/PollGroup' } }
        ungrouped: { type: array, items: { $ref: '#/components/schemas/PollGroupMember' } }
    PollGroupInfo:
      type: object
      properties: { id: { type: string }, name: { type: string }, color: { type: integer }, members: { type: integer } }
    PollGroupRank:
      type: object
      properties:
        rank: { type: integer }
        id: { type: string }
        name: { type: string }
        color: { type: integer }
        members: { type: integer }
        score: { type: number }
        answered: { type: integer, description: Questions with a counted answer }
    PollRank:
      type: object
      properties:
        rank: { type: integer, description: 'Equal points and right answers share a rank' }
        key: { type: string, description: 'Opaque; compare with me_key to find yourself' }
        name: { type: string }
        score: { type: number }
        correct: { type: integer }
        answered: { type: integer }
        participant_id: { type: string, description: Teacher view only }
        real_name: { type: string, description: Teacher view only }
        nickname: { type: string, description: Teacher view only }
    PollQuestion:
      allOf:
        - $ref: '#/components/schemas/PollQuestionInput'
        - type: object
          properties: { id: { type: string, format: uuid }, poll_id: { type: string, format: uuid }, position: { type: integer } }
    PollBody:
      type: object
      description: Each type uses some fields; ids (o1, l1, r1, z1, row1, col1) are assigned when missing.
      properties:
        format: { type: string, enum: ['', markdown] }
        options: { type: array, items: { $ref: '#/components/schemas/Choice' }, description: 'SINGLE, MULTI, BLANK_OPT, DRAG' }
        display: { type: string, enum: [radio, dropdown], description: SINGLE }
        max_choices: { type: integer, description: 'MULTI (0 = any)' }
        left: { type: array, items: { $ref: '#/components/schemas/Choice' } }
        right: { type: array, items: { $ref: '#/components/schemas/Choice' } }
        zones: { type: array, items: { $ref: '#/components/schemas/Choice' }, description: 'DRAG into boxes; empty = ranking' }
        rows: { type: array, items: { $ref: '#/components/schemas/Choice' }, description: 'MATRIX rows, LIKERT statements' }
        columns: { type: array, items: { $ref: '#/components/schemas/Choice' } }
        mode: { type: string, enum: [single, multi, text], description: MATRIX }
        scale: { type: array, items: { type: string }, description: 'LIKERT: 5 or 7 labels' }
        min: { type: number }
        max: { type: number }
        step: { type: number }
        min_label: { type: string }
        max_label: { type: string }
        unit: { type: string }
        from: { type: string, description: 'DATE YYYY-MM-DD or TIME HH:MM' }
        to: { type: string }
        points: { type: integer, description: 'RATING: 3-10 stars' }
        max_length: { type: integer }
        max_words: { type: integer }
        max_entries: { type: integer, description: 'WORD_CLOUD: 1-5' }
        language: { type: string, description: CODE }
        accept: { type: array, items: { type: string, enum: [image, pdf, document, any] } }
        max_mb: { type: integer, description: 'FILE: 1-5' }
        max_seconds: { type: integer, description: 'AUDIO 5-60, VIDEO 5-30' }
    PollAnswer:
      type: object
      description: Each type uses some fields (see the developer docs, Polls).
      properties:
        selected: { type: array, items: { type: string } }
        pairs: { type: object, additionalProperties: { type: string } }
        blanks: { type: object, additionalProperties: { type: string } }
        order: { type: array, items: { type: string } }
        text: { type: string }
        words: { type: array, items: { type: string } }
        number: { type: number }
        date: { type: string }
        time: { type: string }
        rows: { type: object, additionalProperties: { type: string } }
        multi: { type: object, additionalProperties: { type: array, items: { type: string } } }
        cells: { type: object, additionalProperties: { type: string } }
        file: { type: object, readOnly: true, properties: { id: { type: string }, name: { type: string }, size: { type: integer }, content_type: { type: string } } }
    PollJoinResult:
      type: object
      properties:
        participant_id: { type: string, format: uuid }
        identified: { type: boolean }
        token: { type: string, description: 'Anonymous only: send as X-Poll-Token' }
    PollResult:
      type: object
      description: Live summary of one question; fields depend on the type.
      properties:
        question_id: { type: string }
        type: { type: string }
        responses: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
        grid: { type: object, additionalProperties: { type: object, additionalProperties: { type: integer } } }
        row_means: { type: object, additionalProperties: { type: number } }
        ranks: { type: array, items: { type: object, properties: { id: { type: string }, avg_rank: { type: number }, first: { type: integer } } } }
        words: { type: array, items: { type: object, properties: { word: { type: string }, count: { type: integer }, hidden: { type: boolean } } } }
        blank_words: { type: object, additionalProperties: { type: array, items: { type: object } } }
        texts: { type: array, items: { type: object, properties: { text: { type: string }, cell: { type: string }, name: { type: string }, participant_id: { type: string }, hidden: { type: boolean }, at: { type: integer } } } }
        stats: { type: object, properties: { count: { type: integer }, mean: { type: number }, median: { type: number }, min: { type: number }, max: { type: number }, buckets: { type: array, items: { type: object } } } }
        values: { type: array, items: { type: object, properties: { value: { type: string }, count: { type: integer } } } }
        files: { type: array, items: { type: object }, description: Teacher view only }
    PublicPoll:
      type: object
      properties:
        type: { type: string, enum: [poll, update] }
        code: { type: string }
        title: { type: string }
        identity: { type: string }
        audience: { type: string }
        pacing: { type: string }
        show_results: { type: string }
        allow_edit: { type: boolean }
        status: { type: string }
        current_index: { type: integer }
        revealed: { type: boolean }
        total: { type: integer }
        questions: { type: array, items: { $ref: '#/components/schemas/PollQuestion' } }
        joined: { type: boolean }
        identified: { type: boolean }
        answers: { type: object, additionalProperties: { $ref: '#/components/schemas/PollAnswer' } }
        results: { type: object, additionalProperties: { $ref: '#/components/schemas/PollResult' } }
        scoring: { type: boolean }
        speed_bonus: { type: boolean }
        leaderboard_mode: { type: string }
        show_answers: { type: string }
        answers_revealed: { type: boolean }
        question_started_at: { type: integer, description: 'Server epoch ms when the current question appeared (presenter pacing)' }
        keys: { type: object, additionalProperties: { $ref: '#/components/schemas/PollKey' }, description: Revealed answer keys only }
        scores: { type: object, additionalProperties: { $ref: '#/components/schemas/PollScore' }, description: 'Own scores, where the key is revealed' }
        leaderboard: { type: array, items: { $ref: '#/components/schemas/PollRank' }, description: 'Top 10, when leaderboard=everyone' }
        me: { $ref: '#/components/schemas/PollRank' }
        me_key: { type: string }
        nickname: { type: string }
        group_mode: { type: string }
        group_acceptance: { type: string }
        groups: { type: array, items: { $ref: '#/components/schemas/PollGroupInfo' } }
        group_leaderboard: { type: array, items: { $ref: '#/components/schemas/PollGroupRank' }, description: 'When the leaderboard is shown to everyone' }
        my_group: { type: string }
        captain: { type: boolean }
        group_answers: { type: object, description: "Teammates' answers (first-answer and captain groups)", additionalProperties: { type: object, properties: { by: { type: string }, value: { $ref: '#/components/schemas/PollAnswer' } } } }
        board_open: { type: boolean, description: 'The whiteboard is shown (fetch /board; live changes arrive as `board` socket events)' }
    PollTeacherResults:
      type: object
      properties:
        type: { type: string, enum: [results] }
        poll: { $ref: '#/components/schemas/Poll' }
        participants: { type: integer }
        results: { type: object, additionalProperties: { $ref: '#/components/schemas/PollResult' } }
        leaderboard: { type: array, items: { $ref: '#/components/schemas/PollRank' }, description: 'Scored polls: every participant' }
        group_leaderboard: { type: array, items: { $ref: '#/components/schemas/PollGroupRank' } }
