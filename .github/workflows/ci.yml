name: ci

on:
  push:
    branches: [main, test, dev, 'feature/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/server ./cmd/server
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint internal/apidocs/openapi.yaml --format=summary

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (Podman, preinstalled on the runner)
        run: podman build -t localhost/quiz-platform:ci .
      - name: Compose smoke test (Docker)
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-password\n' > .env
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:8080/healthz
          docker compose down -v
