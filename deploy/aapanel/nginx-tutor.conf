# Paste into the tutoring site's config in aaPanel (Website → the tutoring
# subdomain → Config), replacing any "location /" block aaPanel added, below
# its SSL lines, after deleting aaPanel's static-file blocks (as for the main
# site). tutoring.sh writes this file with your ports filled in:
#   cat /www/quiz-app/nginx-tutor.conf

    # Recordings are uploaded in parts of a few seconds each (D-80).
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # LiveKit: the browsers' signalling connection (media itself goes
    # straight to UDP __LIVEKIT_UDP__, or TCP __LIVEKIT_TCP__).
    location /rtc {
        proxy_pass http://127.0.0.1:__LIVEKIT_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The tutoring service: its API, live connections and recordings. "^~"
    # keeps aaPanel's file rules out; /rtc above still wins, being longer.
    location ^~ / {
        proxy_pass http://127.0.0.1:__TUTOR_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Recordings stream to the browser as they're read.
        proxy_buffering off;
    }
