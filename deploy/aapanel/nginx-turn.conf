# Tutoring's relay on port 443 with aaPanel's nginx (D-83, TS-NFR-12).
#
# nginx's stream module takes port 443 and splits it by name: connections
# for turn.example.edu have TLS ended here and go on to LiveKit's TURN
# (deploy/livekit.yaml: tls_port 5349, external_tls true); everything else
# goes, untouched, to the HTTPS sites, which now listen on 127.0.0.1:8443
# with the PROXY protocol so they still see each visitor's address.
#
# This changes every HTTPS site on the server. Before you start:
#   - nginx -V must list --with-stream and --with-stream_ssl_preread_module
#     (aaPanel's nginx builds have them; otherwise rebuild nginx in aaPanel);
#   - get a certificate for turn.example.edu (an aaPanel site for the name
#     with Let's Encrypt, then point the paths below at its files).
#
# 1. Put this file's stream block at the top level of nginx.conf (beside the
#    http block, not inside it), e.g. include it from
#    /www/server/nginx/conf/nginx.conf.
# 2. In every site's config, change
#        listen 443 ssl;            listen [::]:443 ssl;
#    to
#        listen 127.0.0.1:8443 ssl proxy_protocol;
#        set_real_ip_from 127.0.0.1;
#        real_ip_header proxy_protocol;
#    (and drop any "listen 443 quic" lines). aaPanel rewrites a site's
#    listen lines when its SSL settings are saved: check them afterwards.
# 3. nginx -t && nginx -s reload.
#
# Not tested on aaPanel itself: the same split was tested with Caddy's
# layer4 plugin (deploy/Caddyfile).

stream {
	map $ssl_preread_server_name $tls_upstream {
		turn.example.edu  turn_tls;
		default           https_sites;
	}

	upstream turn_tls    { server 127.0.0.1:5350; }  # below: TLS ends, then LiveKit
	upstream https_sites { server 127.0.0.1:8443; }

	server {
		listen 443;
		listen [::]:443;
		ssl_preread on;
		proxy_pass $tls_upstream;
		# Both destinations get the visitor's address in a PROXY protocol header.
		proxy_protocol on;
	}

	# The relay: TLS ends here, LiveKit's TURN listens without TLS.
	server {
		listen 127.0.0.1:5350 ssl proxy_protocol;
		ssl_certificate     /www/server/panel/vhost/cert/turn.example.edu/fullchain.pem;
		ssl_certificate_key /www/server/panel/vhost/cert/turn.example.edu/privkey.pem;
		ssl_protocols TLSv1.2 TLSv1.3;
		proxy_pass 127.0.0.1:5349;
		proxy_timeout 1h; # a lesson's media flows through one connection
	}
}
