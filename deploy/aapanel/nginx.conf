# Paste into the site's config in aaPanel (Website → your site → Config),
# replacing any "location /" block aaPanel added, below its SSL lines.
# Change 8080 if you chose another port in install.sh.

    # Uploads in polls (up to 12 MB) and question CSVs.
    client_max_body_size 25m;

    # Security headers, as the Caddy setup sends them (ADR-16). Google Drive's
    # picker (D-71) needs apis.google.com and Google's frames; drop those if
    # Drive is off.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; frame-src https://docs.google.com https://drive.google.com https://content.googleapis.com; connect-src 'self' wss: https://content.googleapis.com https://www.googleapis.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Only once HTTPS works: browsers then refuse plain HTTP for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Everything goes to the app: pages, the API and the live connections.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets: live quizzes, polls and meetings.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
