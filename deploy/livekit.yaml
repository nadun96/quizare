# LiveKit for a host install (D-58): run livekit-server 1.13.7 with
#   livekit-server --config /etc/livekit/livekit.yaml
# (its own systemd unit, or the docker.io/livekit/livekit-server:v1.13.7 image
# with --network host). Caddy forwards wss://tutor.example.edu/rtc to port
# 7880 on loopback; media goes to UDP 7882 (TCP 7881 as a fallback), which
# the firewall must allow.
# Keep 7880 closed in the firewall: only Caddy, on this host, talks to it.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
# The relay for students behind school firewalls that let only HTTPS out
# (D-83, TS-NFR-12). Browsers are told turns:turn.example.edu:443; Caddy,
# built with the layer4 plugin, takes connections for that name on 443,
# ends TLS with its own certificate and passes them here on 5349 (keep
# 5349 closed in the firewall). UDP 3478 is plain TURN, for networks that
# block other UDP; open it if you like. Point turn.example.edu at this server.
turn:
  enabled: true
  domain: turn.example.edu
  tls_port: 5349
  external_tls: true
  udp_port: 3478
# "tutoring: <secret>" (openssl rand -hex 24), mode 0400; the tutoring
# service reads the same file (LIVEKIT_API_SECRET_FILE).
key_file: /etc/livekit/keys.yaml
logging:
  level: info
# Prometheus metrics, which the tutoring service reads for monitoring (D-82,
# LIVEKIT_METRICS_URL). Keep 6789 closed in the firewall too.
prometheus:
  port: 6789
