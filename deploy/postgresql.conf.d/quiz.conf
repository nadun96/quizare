# PostgreSQL 16/17 tuning for a shared 4 GB / Core i3 host (architecture §2.1, §5).
# Drop into /etc/postgresql/<ver>/main/conf.d/ and restart PostgreSQL.

listen_addresses = 'localhost'          # unix socket + loopback only (ADR-16)
max_connections = 30                     # pgx pool 15 + River 2-5 + psql/backup/monitoring
shared_buffers = 512MB                   # 12.5% of RAM: the box is shared with Go and Caddy
effective_cache_size = 1536MB            # planner hint, not an allocation
work_mem = 8MB                           # per sort/hash node; hashes get 2x (hash_mem_multiplier)
maintenance_work_mem = 128MB
autovacuum_work_mem = 64MB               # caps the autovacuum worst case (R2)
autovacuum_max_workers = 3

wal_compression = on
checkpoint_completion_target = 0.9
huge_pages = try

idle_in_transaction_session_timeout = 30s
statement_timeout = 15s                  # app role; set 0 for the backup role if needed

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
