# QR Classroom Quiz Platform: Docker Compose / Podman Compose (D-37).
#
#   cp .env.example .env              # set POSTGRES_PASSWORD
#   docker compose up -d --build      # or: podman compose up -d --build
#   open http://localhost:8080
#
# HTTPS through Caddy (needed when students connect over the LAN or a domain):
#   set QP_DOMAIN and QP_BASE_URL in .env, then
#   docker compose --profile tls up -d --build
#
# Tutoring sessions (D-59): the tutoring service and LiveKit, beside the app.
# Set QP_TUTORING_URL (the tutoring service's public address, e.g.
# https://tutor.example.edu) and QP_TUTORING_MEDIA_URL (wss://tutor.example.edu)
# in .env, open UDP 7882 and TCP 7881 in the firewall, then
#   docker compose --profile tls --profile tutoring up -d --build
#
# Create the first admin (the password is read from stdin):
#   echo 'a-strong-password' | docker compose exec -T app /app/server create-admin admin@example.edu "Admin"

name: quiz

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Tuning from deploy/postgresql.conf.d/quiz.conf (architecture §2.1, §5).
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - statement_timeout=15s
      - -c
      - shared_preload_libraries=pg_stat_statements
    shm_size: 256m
    networks:
      - quiz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only the app reaches the database (ADR-16).

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/quiz-platform:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      QP_DATABASE_URL: postgres://quiz:${POSTGRES_PASSWORD}@db:5432/quiz?sslmode=disable
      QP_BASE_URL: ${QP_BASE_URL:-http://localhost:8080}
      # Believe X-Forwarded-For only from Caddy's fixed address below, so rate
      # limits see each student's network instead of Caddy (D-51).
      QP_TRUSTED_PROXIES: ${QP_CADDY_IP:-172.31.250.10}
      # First start writes a random 32-byte master key into the app volume.
      # Back the volume up: without the key, stored LLM API keys are unreadable.
      QP_KEK_GENERATE: "1"
      QP_DB_WAIT_SECONDS: "90"
      # Backups made from the admin console (D-57). Keep a copy off this host:
      # a backup is only as safe as the disk it's on.
      QP_BACKUP_DIR: /var/lib/quiz/backups
      # Tutoring (D-59): on when QP_TUTORING_URL is set. The shared secret is
      # created on first start in the tutorsecrets volume, which the tutoring
      # service reads too.
      QP_TUTORING_URL: ${QP_TUTORING_URL:-}
      QP_TUTORING_SECRET_FILE: /var/lib/tutoring/tutoring.secret
      QP_TUTORING_SECRET_GENERATE: "1"
      QP_API_DOCS: ${QP_API_DOCS:-1}
      QP_SMTP_ADDR: ${QP_SMTP_ADDR:-}
      QP_SMTP_FROM: ${QP_SMTP_FROM:-no-reply@localhost}
      QP_SMTP_USER: ${QP_SMTP_USER:-}
      GOMEMLIMIT: 700MiB
    mem_limit: 900m
    volumes:
      - appdata:/var/lib/quiz
      - tutorsecrets:/var/lib/tutoring
    ports:
      - "${QP_HTTP_BIND:-127.0.0.1:8080}:8080"
    networks:
      - quiz

  tutoring:
    profiles: ["tutoring"]
    build:
      context: tutoring
    image: localhost/quiz-tutoring:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TUTOR_DATABASE_URL: postgres://quiz:${POSTGRES_PASSWORD}@db:5432/quiz?sslmode=disable
      TUTOR_SECRET_FILE: /var/lib/tutoring/tutoring.secret
      TUTOR_PLATFORM_URL: http://app:8080
      TUTOR_PLATFORM_ORIGIN: ${QP_BASE_URL:-http://localhost:8080}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${QP_TUTORING_MEDIA_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: tutoring
      LIVEKIT_API_SECRET_FILE: /var/lib/tutoring/livekit-keys.yaml
      TUTOR_GENERATE_LIVEKIT_KEYS: "1"
      GOMEMLIMIT: 300MiB
    mem_limit: 400m
    volumes:
      - tutorsecrets:/var/lib/tutoring
    ports:
      - "${QP_TUTORING_BIND:-127.0.0.1:8090}:8090"
    networks:
      - quiz

  livekit:
    profiles: ["tutoring"]
    image: docker.io/livekit/livekit-server:v1.13.7
    restart: unless-stopped
    depends_on:
      tutoring:
        condition: service_healthy # it writes the key file
    command: ["--config", "/etc/livekit.yaml"]
    # Its own limits, so a full class can't take the quiz platform's share (TS-NFR-54).
    mem_limit: 2g
    cpus: 2
    volumes:
      - ./deploy/container/livekit.yaml:/etc/livekit.yaml:ro,Z
      - tutorsecrets:/var/lib/tutoring:ro
    ports:
      - "${QP_LIVEKIT_BIND:-127.0.0.1:7880}:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - quiz

  caddy:
    image: docker.io/library/caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      QP_DOMAIN: ${QP_DOMAIN:-localhost}
      QP_TUTOR_DOMAIN: ${QP_TUTOR_DOMAIN:-tutor.localhost}
      QP_TUTORING_URL: ${QP_TUTORING_URL:-}
    ports:
      # Rootless Podman cannot bind ports below 1024 by default; set
      # CADDY_HTTP_PORT=8081 / CADDY_HTTPS_PORT=8443 (or lower
      # net.ipv4.ip_unprivileged_port_start).
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    networks:
      quiz:
        ipv4_address: ${QP_CADDY_IP:-172.31.250.10}
    volumes:
      - ./deploy/container/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddydata:/data
      - caddyconfig:/config

# A fixed subnet so Caddy has a known address. Change QP_COMPOSE_SUBNET and
# QP_CADDY_IP together if it clashes with a network you already use.
networks:
  quiz:
    ipam:
      config:
        - subnet: ${QP_COMPOSE_SUBNET:-172.31.250.0/24}

volumes:
  pgdata:
  appdata:
  tutorsecrets:
  caddydata:
  caddyconfig:
